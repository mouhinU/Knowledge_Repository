# ============================================================
# Knowledge Repository - 应用服务
# ============================================================
# 仅管理 knowledge-app 容器。
# MySQL / Milvus / etcd / minio 为共用基础设施，由 docker-compose.infra.yml 管理。
# 所有持久化存储均使用宿主机 bind mount，不依赖 Docker named volume。
# ============================================================

services:

  knowledge-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION}
    image: ${IMAGE_NAME}:${APP_VERSION}
    container_name: knowledge-app
    ports:
      - "8091:8091"
    environment:
      # 时区
      TZ: Asia/Shanghai
      # MySQL（共用服务，宿主机端口 3307）
      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: 3307
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # Milvus（共用服务，宿主机端口 19530）
      MILVUS_HOST: host.docker.internal
      MILVUS_PORT: 19530
      # Ollama（宿主机上运行）
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: bge-m3
      # LLM 对话模型（DeepSeek 云端）
      LLM_PROVIDER: deepseek
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_CHAT_MODEL: deepseek-flash
      LLM_TEMPERATURE: "0.7"
      LLM_MAX_TOKENS: "4096"
      # Spring Security 管理员凭据
      SPRING_SECURITY_USER: ${SPRING_SECURITY_USER}
      SPRING_SECURITY_PASSWORD: ${SPRING_SECURITY_PASSWORD}
      # 文件存储（宿主机 bind mount）
      STORAGE_PATH: /app/data/documents
      # JVM
      JAVA_OPTS: "-Xms512m -Xmx1024m -XX:+UseG1GC -Duser.timezone=Asia/Shanghai"
    volumes:
      # 文档文件存储 → 宿主机 data/documents/
      - ./data/documents:/app/data/documents
      # 日志存储 → 宿主机 docker/logs/app/
      - ./docker/logs/app:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8091/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
