name: Build & Push Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
    # 只有真正影响镜像内容的文件变化才 build+push;
    # 纯改 README / docs / workflow 自身不再触发一次 GHCR 推送。
    # tag push (v*) 忽略 paths 过滤(GitHub 限制: tags 与 paths 互斥,共存时 paths 无效),
    # 因此 release tag 一定会打镜像。
    paths:
      - "**/*.java"
      - "**/pom.xml"
      - "pom.xml"
      - "**/src/main/resources/**"
      - "Dockerfile"
      - "Dockerfile.*"
      - "docker/**"
      - ".mvn/**"
      - "mvnw"
      - "mvnw.cmd"
  pull_request:
    branches: [main]
    paths:
      - "**/*.java"
      - "**/pom.xml"
      - "pom.xml"
      - "**/src/main/resources/**"
      - "Dockerfile"
      - "Dockerfile.*"
      - "docker/**"
      - ".mvn/**"
      - "mvnw"
      - "mvnw.cmd"
  workflow_dispatch: {}

# Workflow-level 最小权限声明：即使仓库 Settings → Actions → General 把默认
# workflow permissions 改成 "Read repository contents and packages permissions"
# 或 "Read-only"，本工作流仍可推 GHCR。避免依赖管理员的 UI 配置。
permissions:
  contents: read
  packages: write

# 同分支/PR 串行；新 push 自动作废进行中的旧 build(避免堆积/重复推 tag)
concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    # ubuntu-latest 于 2026-10-19 起会静默迁移到 Ubuntu 26
    # (https://github.com/actions/runner-images/issues/14748)。
    # 钉住 ubuntu-24.04 保证 docker daemon / buildx / glibc 基线可预测；
    # 等 26.04 GA 一段时间后再单独 PR 迁移。
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Compute image tag
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          # GHCR 要求 repository 段全小写；github.repository 会保留大小写。
          IMAGE="$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tags=${IMAGE}:${GITHUB_REF_NAME},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            echo "tags=${IMAGE}:sha-${SHORT_SHA},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            # PR / 其他分支：只计算标签用于本地构建，不推送
            echo "tags=${IMAGE}:pr-dryrun-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide push flag
        id: pushflag
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.pushflag.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.pushflag.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ github.run_number }}
