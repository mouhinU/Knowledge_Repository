name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# CI 只需要读源码；不写 GHCR、不改 PR 状态以外的资源。
# 顶层 permissions 会覆盖仓库默认 workflow permissions（即使是 Read-only 也能跑）。
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Cache Maven local repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build and run checks
        run: mvn -B -V clean verify -DskipTests
