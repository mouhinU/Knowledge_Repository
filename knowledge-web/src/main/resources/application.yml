server:
  port: 8091
  servlet:
    context-path: /

spring:
  application:
    name: knowledge-repository

  # ==================== 数据源配置 ====================
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/knowledge_repository?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
    # H2 (备用，取消注释切换回 H2)
    # url: jdbc:h2:file:./data/knowledge-repository;AUTO_SERVER=TRUE;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    # driver-class-name: org.h2.Driver
    # username: sa
    # password:

  # h2:
  #   console:
  #     enabled: true
  #     path: /h2-console

  # ==================== Flyway ====================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ==================== 文件上传（支持 PDF/Word/Excel/PPT/TXT/CSV/HTML）====================
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB

  # ==================== 静态资源缓存控制（开发阶段禁用缓存）====================
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
          must-revalidate: true

  # ==================== Security ====================
  security:
    user:
      name: ${SPRING_SECURITY_USER:admin}
      password: ${SPRING_SECURITY_PASSWORD:admin}

# ==================== MyBatis-Plus ====================
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ==================== Knowledge Base 配置 ====================
knowledge:
  # ---------- Milvus 向量数据库 ----------
  milvus:
    host: ${MILVUS_HOST:localhost}
    port: ${MILVUS_PORT:19530}
    collection-name: knowledge_chunks
    dimension: 1024
    database-name: default

  # ---------- Embedding 模型配置 ----------
  # provider: dashscope | ollama
  embedding:
    provider: ollama

    # DashScope (阿里云通义)
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:your-dashscope-api-key}
      model-name: text-embedding-v3

    # Ollama (本地模型，OpenAI 兼容接口)
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434/v1}
      model-name: ${OLLAMA_MODEL:bge-m3}
      api-key: ollama

  # ---------- LLM 对话模型配置 ----------
  # provider: dashscope | deepseek | ollama
  llm:
    provider: ${LLM_PROVIDER:ollama}
    temperature: ${LLM_TEMPERATURE:0.7}
    max-tokens: ${LLM_MAX_TOKENS:4096}
    # 流式对话网关（黑板 Agent 逐 token 输出）独立配置：推理型模型会先把预算耗在思考链上，
    # 故预算需明显大于上面的 max-tokens，超时也更长，避免正式内容被"喂空"。
    streaming:
      max-tokens: ${LLM_STREAMING_MAX_TOKENS:16384}
      timeout-seconds: ${LLM_STREAMING_TIMEOUT_SECONDS:300}

    # DashScope (阿里云通义)
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:your-dashscope-api-key}
      model-name: ${DASHSCOPE_CHAT_MODEL:qwen-plus}

    # DeepSeek
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:your-deepseek-api-key}
      model-name: ${DEEPSEEK_CHAT_MODEL:deepseek-flash}

    # Ollama (本地模型)
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434/v1}
      model-name: ${OLLAMA_CHAT_MODEL:llama3.2}
      api-key: ollama

  # ---------- 黑板模式 Agent 配置 ----------
  blackboard:
    search:
      max-results: 10
      min-score: 0.5

  # ---------- 文件存储 ----------
  storage:
    path: ${STORAGE_PATH:./data/documents}

  # ---------- 在线考试评分配置 ----------
  exam:
    grading-delay-minutes: ${EXAM_GRADING_DELAY_MINUTES:30}
    # 试卷校对关口：true=所有试卷须人工校对通过后方可发布开考；
    # false=校验通过且质量分达阈可自动发布，但校验不过 / 低分仍强制人工校对（不可绕过）。
    review-required: ${EXAM_REVIEW_REQUIRED:true}

# ==================== 日志 ====================
logging:
  level:
    root: INFO
    com.mouhin.knowledge.repository: DEBUG
    dev.langchain4j: INFO
    io.milvus: INFO
