server:
  port: 8091
  servlet:
    context-path: /

# ==================== 运维可观测性（2-F）====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

spring:
  application:
    name: knowledge-repository

  # ==================== 数据源配置 ====================
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/knowledge_repository?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
    # ==================== HikariCP 连接池（OPS-2）====================
    # 显式给上有界参数，避免依赖默认值：容器内存有限（mem_limit 1536m），
    # 池过大既压 MySQL 侧连接、又放大单次慢查询占用连接的冲击面。配合 CONC-3
    # 已将 Milvus / embedding 慢 IO 移出事务后，连接被长时间占用的概率显著下降，
    # 此处 leak-detection 阈值用于兜底发现残留的"事务内做慢 IO"回归。所有值可用环境变量覆盖。
    hikari:
      pool-name: KnowledgeHikariPool
      # 最大连接数：与容器核数 / MySQL max_connections 匹配，保守取 10
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      # 最小空闲连接：保留 2 个热连接，避免冷启动瞬时建连抖动
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      # 获取连接最长等待 30s：超时快速失败（配合上界池，池满时不无限堆积线程）
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT_MS:30000}
      # 空闲连接存活 10min 后回收（高于 minimum-idle 的部分）
      idle-timeout: ${HIKARI_IDLE_TIMEOUT_MS:600000}
      # 连接最长生命周期 30min：略小于 MySQL 默认 wait_timeout，避免使用已被服务端关闭的连接
      max-lifetime: ${HIKARI_MAX_LIFETIME_MS:1800000}
      # 每 20s 发送保活探测，防止中间层（防火墙 / 云 LB）空闲断连
      keepalive-time: ${HIKARI_KEEPALIVE_TIME_MS:20000}
      # 连接有效性校验超时 5s
      validation-timeout: ${HIKARI_VALIDATION_TIMEOUT_MS:5000}
      # 连接借出超过 10s 未归还即打告警栈，定位潜在泄漏
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION_MS:10000}
    # H2 (备用，取消注释切换回 H2)
    # url: jdbc:h2:file:./data/knowledge-repository;AUTO_SERVER=TRUE;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    # driver-class-name: org.h2.Driver
    # username: sa
    # password:

  # h2:
  #   console:
  #     enabled: true
  #     path: /h2-console

  # ==================== Flyway ====================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ==================== 文件上传（支持 PDF/Word/Excel/PPT/TXT/CSV/HTML）====================
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB

  # ==================== 静态资源缓存控制（开发阶段禁用缓存）====================
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
          must-revalidate: true

  # ==================== Security ====================
  security:
    user:
      name: ${SPRING_SECURITY_USER:admin}
      password: ${SPRING_SECURITY_PASSWORD:admin}

# ==================== MyBatis-Plus ====================
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ==================== Knowledge Base 配置 ====================
knowledge:
  # ---------- Milvus 向量数据库 ----------
  milvus:
    host: ${MILVUS_HOST:localhost}
    port: ${MILVUS_PORT:19530}
    collection-name: knowledge_chunks
    dimension: 1024
    database-name: default

  # ---------- 多模型连接治理（Phase R1 · 三段式 chat/embedding，vision 于 Phase B 引入）----------
  # 每个角色独立 base-url / 密钥 / 超时预算；供应商由 base-url 决定（均走 OpenAI 兼容协议）。
  # 密钥通过 per-role 环境变量注入，便于独立轮换与最小权限。
  llm:
    # ----- 对话角色：出题 / 评分 / 黑板 Agent / 文章生成 -----
    chat:
      provider: ${LLM_CHAT_PROVIDER:deepseek}
      base-url: ${LLM_CHAT_BASE_URL:https://api.deepseek.com}
      api-key: ${LLM_CHAT_API_KEY:}
      model-name: ${LLM_CHAT_MODEL:deepseek-flash}
      temperature: ${LLM_TEMPERATURE:0.7}
      max-tokens: ${LLM_MAX_TOKENS:4096}
      connect-timeout-seconds: ${LLM_CHAT_CONNECT_TIMEOUT_SECONDS:5}
      read-timeout-seconds: ${LLM_CHAT_READ_TIMEOUT_SECONDS:120}
      call-timeout-seconds: ${LLM_CHAT_CALL_TIMEOUT_SECONDS:180}
      # 流式对话独立预算：推理型模型会先把 token 耗在思考链上，故上限与超时须明显大于非流式，避免正文被"喂空"。
      streaming:
        max-tokens: ${LLM_STREAMING_MAX_TOKENS:16384}
        timeout-seconds: ${LLM_STREAMING_TIMEOUT_SECONDS:300}
    # ----- 向量角色：短平快高并发，秒级超时快速失败，与 chat 连接池隔离 -----
    embedding:
      provider: ${LLM_EMBED_PROVIDER:ollama}
      base-url: ${LLM_EMBED_BASE_URL:http://localhost:11434/v1}
      api-key: ${LLM_EMBED_API_KEY:ollama}
      model-name: ${LLM_EMBED_MODEL:bge-m3}
      connect-timeout-seconds: ${LLM_EMBED_CONNECT_TIMEOUT_SECONDS:2}
      read-timeout-seconds: ${LLM_EMBED_READ_TIMEOUT_SECONDS:10}
      call-timeout-seconds: ${LLM_EMBED_CALL_TIMEOUT_SECONDS:15}
    # ----- 韧性护栏（Phase R2）：按角色独立熔断/重试，一端点抖动不殃及他角色 -----
    resilience:
      chat:
        circuit-breaker:
          sliding-window-size: 20
          failure-rate-threshold: 50
          slow-call-duration-seconds: 60
          slow-call-rate-threshold: 100
          wait-duration-seconds: 30
          permitted-number-of-calls-in-half-open: 5
        retry:
          max-attempts: 3
          wait-duration-ms: 500
          backoff-multiplier: 2.0
      # 流式角色不重试（max-attempts=1）：重试会向已吐字的 UI 重复推送增量，仅保留熔断快速失败
      chat-stream:
        retry:
          max-attempts: 1
      embedding:
        retry:
          max-attempts: 2
          wait-duration-ms: 200
      # vision 角色于 Phase B 起消费，参数先行占位
      vision:
        retry:
          max-attempts: 2
          wait-duration-ms: 300

  # ---------- 黑板模式 Agent 配置 ----------
  blackboard:
    search:
      max-results: 10
      min-score: 0.5

  # ---------- 文件存储 ----------
  storage:
    path: ${STORAGE_PATH:./data/documents}

  # ---------- 管理端登录鉴权（无状态 JWT，HS256）----------
  # 密钥须由 KNOWLEDGE_ADMIN_JWT_SECRET 注入生产环境；缺省值仅限本地开发，切勿用于线上。
  admin:
    jwt:
      secret: ${KNOWLEDGE_ADMIN_JWT_SECRET:knowledge-repo-dev-admin-jwt-secret-change-me}
      expiration-hours: ${KNOWLEDGE_ADMIN_JWT_EXPIRATION_HOURS:8}

  # ---------- 在线考试评分配置 ----------
  exam:
    grading-delay-minutes: ${EXAM_GRADING_DELAY_MINUTES:30}
    # 试卷校对关口：true=所有试卷须人工校对通过后方可发布开考；
    # false=校验通过且质量分达阈可自动发布，但校验不过 / 低分仍强制人工校对（不可绕过）。
    review-required: ${EXAM_REVIEW_REQUIRED:true}
    # 看图题 / 看图写话 配图二进制存放目录（由文档图片提取器写入，浏览器经 /api/exam/assets/{assetKey} 拉取）
    asset-path: ${EXAM_ASSET_PATH:./data/exam-assets}

# ==================== 日志 ====================
logging:
  level:
    root: INFO
    com.mouhin.knowledge.repository: DEBUG
    dev.langchain4j: INFO
    io.milvus: INFO
