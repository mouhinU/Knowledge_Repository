server:
  port: 8091
  servlet:
    context-path: /

spring:
  application:
    name: knowledge-repository

  # ==================== 数据源配置 ====================
  datasource:
    # H2 (开发环境)
    url: jdbc:h2:file:./data/knowledge-repository;AUTO_SERVER=TRUE;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    # MySQL (生产环境，取消注释)
    # url: jdbc:mysql://localhost:3306/knowledge_repository?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    # driver-class-name: com.mysql.cj.jdbc.Driver
    # username: root
    # password: your_password

  h2:
    console:
      enabled: true
      path: /h2-console

  # ==================== Flyway ====================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ==================== 文件上传（支持 PDF/Word/Excel/PPT/TXT/CSV/HTML）====================
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB

  # ==================== Security (开发阶段) ====================
  security:
    user:
      name: admin
      password: admin

# ==================== MyBatis-Plus ====================
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ==================== Knowledge Base 配置 ====================
knowledge:
  # ---------- Milvus 向量数据库 ----------
  milvus:
    host: localhost
    port: 19530
    collection-name: knowledge_chunks
    dimension: 1536
    database-name: default

  # ---------- Embedding 模型配置 ----------
  # provider: dashscope | ollama
  embedding:
    provider: dashscope

    # DashScope (阿里云通义)
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:your-dashscope-api-key}
      model-name: text-embedding-v3

    # Ollama (本地模型，OpenAI 兼容接口)
    ollama:
      base-url: http://localhost:11434/v1
      model-name: bge-m3
      api-key: ollama

# ==================== 日志 ====================
logging:
  level:
    root: INFO
    com.mouhin.knowledge.repository: DEBUG
    dev.langchain4j: INFO
    io.milvus: INFO
