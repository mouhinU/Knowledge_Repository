<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>在线考试系统</title>
    <style>
        :root {
            /* 品牌主色 —— 对齐管理端 (blue #3b82f6) */
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --primary-dark: #2563eb;
            --primary-light: #eff6ff;
            --primary-soft: #eff6ff;
            --primary-ring: rgba(59, 130, 246, .16);
            --primary-bg: #f1f5f9;

            /* 功能色 —— 对齐管理端 */
            --success: #16a34a;
            --success-dark: #15803d;
            --success-bg: #dcfce7;
            --warning: #d97706;
            --warning-dark: #b45309;
            --warning-bg: #fef3c7;
            --danger: #dc2626;
            --danger-dark: #b91c1c;
            --danger-bg: #fee2e2;
            --info-bg: #dbeafe;

            /* 辅助色 */
            --purple: #7c3aed;
            --purple-bg: #f3e8ff;
            --blue: #2563eb;
            --blue-bg: #dbeafe;
            --green: #16a34a;
            --green-bg: #dcfce7;

            /* 中性色 —— slate 灰阶，对齐管理端 */
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --gray-900: #0f172a;

            /* 表面 / 边框 / 文本 别名 */
            --surface: #ffffff;
            --surface-alt: #f8fafc;
            --border: #e2e8f0;
            --border-strong: #cbd5e1;
            --text: #1e293b;
            --text-secondary: #475569;
            --text-light: #64748b;

            /* 圆角 / 阴影 —— 对齐管理端 */
            --radius-sm: 6px;
            --radius: 10px;
            --radius-lg: 14px;
            --shadow-sm: 0 1px 2px rgba(15, 23, 42, .06);
            --shadow: 0 1px 3px rgba(15, 23, 42, .08), 0 1px 2px rgba(15, 23, 42, .04);
            --shadow-md: 0 4px 14px rgba(15, 23, 42, .08);
            --shadow-lg: 0 20px 50px rgba(15, 23, 42, .18);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, "Noto Sans SC", sans-serif;
            background: var(--primary-bg);
            color: var(--gray-800);
            font-size: 15px;
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* 滚动条 —— 对齐管理端 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: var(--gray-300); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gray-400); }
        ::-webkit-scrollbar-track { background: transparent; }

        /* ===== Timer states ===== */
        .timer-warning {
            color: var(--warning) !important;
            animation: timerPulse 1s ease-in-out infinite;
        }
        .timer-danger {
            color: var(--danger) !important;
            animation: timerPulse 0.5s ease-in-out infinite;
        }
        @keyframes timerPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* Locked answer area (time expired) */
        .exam-locked .answer-controls {
            pointer-events: none;
            opacity: 0.5;
            position: relative;
        }
        .exam-locked .answer-controls::after {
            content: '考试时间已结束';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 8px 24px;
            border-radius: var(--radius);
            font-size: 14px;
            pointer-events: none;
        }
        .exam-locked .question-nav-buttons .btn {
            pointer-events: none;
            opacity: 0.5;
        }

        /* ===== Auth Page ===== */
        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            background: #fff;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }

        .auth-header {
            text-align: center;
            padding: 32px 32px 0;
        }

        .auth-header h1 {
            font-size: 24px;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .auth-header p {
            color: var(--gray-500);
            font-size: 14px;
        }

        .auth-tabs {
            display: flex;
            margin: 24px 32px 0;
            border-bottom: 2px solid var(--gray-200);
        }

        .auth-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            font-weight: 500;
            color: var(--gray-500);
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
            font-size: 15px;
        }

        .auth-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .auth-form {
            padding: 24px 32px 32px;
        }

        .auth-form.hidden { display: none; }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--gray-700);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--gray-300);
            border-radius: var(--radius);
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-ring);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.18s;
            text-decoration: none;
            gap: 6px;
        }

        .btn:active { transform: translateY(1px); }

        .btn-primary {
            background: var(--primary);
            color: #fff;
            width: 100%;
            box-shadow: 0 1px 2px rgba(37, 99, 235, .3);
        }

        .btn-primary:hover { background: var(--primary-hover); }

        .btn-secondary {
            background: var(--gray-100);
            color: var(--gray-700);
        }

        .btn-secondary:hover { background: var(--gray-200); }

        .btn-success {
            background: var(--success);
            color: #fff;
        }

        .btn-success:hover { background: var(--success-dark); }

        .btn-warning {
            background: var(--warning);
            color: #fff;
        }

        .btn-warning:hover { background: var(--warning-dark); }

        .btn-danger {
            background: var(--danger);
            color: #fff;
        }

        .btn-danger:hover { background: var(--danger-dark); }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--gray-300);
            color: var(--gray-700);
        }

        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 13px;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .auth-error {
            background: var(--danger-bg);
            color: var(--danger);
            padding: 10px 12px;
            border-radius: var(--radius);
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        /* ===== Main Layout ===== */
        .app-container { display: none; min-height: 100vh; }

        .app-header {
            background: #fff;
            border-bottom: 1px solid var(--gray-200);
            padding: 0 24px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .app-header .logo {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            display: inline-flex;
            align-items: center;
            gap: 9px;
        }

        .app-header .logo::before {
            content: '';
            width: 22px;
            height: 22px;
            border-radius: 6px;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            box-shadow: 0 2px 6px rgba(59, 130, 246, .35);
        }

        .app-header .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: var(--gray-600);
        }

        .app-header .user-info .user-name {
            font-weight: 500;
            color: var(--gray-800);
        }

        .app-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        /* ===== Section ===== */
        .section {
            margin-bottom: 32px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--gray-800);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title .icon {
            font-size: 22px;
        }

        /* ===== Exam Home Page Menu (Tabs) ===== */
        .page-menu {
            display: flex;
            gap: 4px;
            border-bottom: 2px solid var(--gray-200);
            margin-bottom: 24px;
        }

        .page-menu-item {
            appearance: none;
            border: none;
            background: none;
            font-family: inherit;
            font-size: 15px;
            font-weight: 500;
            color: var(--gray-500);
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.15s, border-color 0.15s;
        }

        .page-menu-item:hover { color: var(--primary); }

        .page-menu-item.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            font-weight: 600;
        }

        .page-menu-item .menu-count {
            background: var(--gray-100);
            color: var(--gray-600);
            border-radius: 999px;
            font-size: 12px;
            padding: 1px 8px;
            font-weight: 600;
        }

        .page-menu-item.active .menu-count {
            background: var(--primary-light);
            color: var(--primary);
        }

        .page-panel { display: none; }
        .page-panel.active { display: block; }

        /* ===== Student Error Book ===== */
        .wb-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 18px;
        }

        .wb-stat-card {
            background: #fff;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-lg);
            padding: 16px;
            text-align: center;
        }

        .wb-stat-value { font-size: 24px; font-weight: 700; color: var(--gray-800); }
        .wb-stat-label { font-size: 12px; color: var(--gray-500); margin-top: 4px; }

        .wb-card {
            background: #fff;
            border: 1px solid var(--gray-200);
            border-left: 4px solid var(--warning);
            border-radius: var(--radius-lg);
            padding: 16px 18px;
            margin-bottom: 12px;
        }

        .wb-card .wb-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .wb-card .wb-tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

        .wb-badge {
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            background: var(--gray-100);
            color: var(--gray-600);
        }

        .wb-badge.type { background: var(--warning-bg); color: var(--warning); }
        .wb-badge.topic { background: var(--blue-bg); color: var(--blue); }
        .wb-badge.diff { background: var(--purple-bg); color: var(--purple); }

        .wb-score { text-align: right; font-weight: 700; }
        .wb-question { font-size: 14px; line-height: 1.6; color: var(--gray-700); margin-bottom: 12px; white-space: pre-wrap; }

        .wb-options { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; font-size: 13px; }
        .wb-option { padding: 4px 10px; border-radius: 6px; border: 1px solid var(--gray-200); font-size: 12px; }
        .wb-option.correct { background: var(--green-bg); border-color: #22c55e; color: #15803d; font-weight: 600; }
        .wb-option.wrong { background: var(--danger-bg); border-color: #ef4444; color: #b91c1c; font-weight: 600; }

        .wb-answer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 10px; }
        .wb-answer { padding: 10px; border-radius: 8px; font-size: 13px; }
        .wb-answer.mine { background: var(--warning-bg); }
        .wb-answer.right { background: var(--green-bg); }
        .wb-answer .wb-answer-label { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
        .wb-answer.mine .wb-answer-label { color: var(--warning); }
        .wb-answer.right .wb-answer-label { color: var(--green); }
        .wb-feedback { background: var(--gray-50); border-radius: 8px; padding: 10px; font-size: 13px; color: var(--gray-600); margin-bottom: 8px; }
        .wb-explain { background: var(--primary-soft); border: 1px solid var(--info-bg); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
        .wb-explain > summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--primary); user-select: none; }
        .wb-explain-title { font-size: 12px; font-weight: 600; color: var(--gray-600); margin: 8px 0 2px; }
        .wb-explain-body { font-size: 13px; color: var(--gray-700, #374151); line-height: 1.6; }
        .wb-foot { display: flex; justify-content: space-between; font-size: 12px; color: var(--gray-400); }

        /* ===== Pager ===== */
        .pager {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .pager-info { font-size: 13px; color: var(--gray-500); }
        .pager-btns { display: flex; gap: 8px; }
        .pager-btn {
            padding: 6px 14px;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            background: #fff;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            color: var(--gray-700);
            transition: background 0.15s, border-color 0.15s;
        }
        .pager-btn:hover:not(:disabled) { background: var(--gray-50); border-color: var(--primary-light); }
        .pager-btn:disabled { opacity: 0.45; cursor: not-allowed; }

        /* ===== Paper Prepare Agent Steps ===== */
        .agent-steps {
            max-width: 460px;
            margin: 40px auto;
            background: #fff;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-lg);
            padding: 24px 28px;
            box-shadow: var(--shadow);
        }
        .agent-steps .agent-steps-title { font-size: 15px; font-weight: 600; color: var(--gray-700); margin-bottom: 16px; text-align: center; }
        .agent-step { display: flex; align-items: center; gap: 12px; padding: 10px 0; color: var(--gray-400); font-size: 14px; }
        .agent-step .agent-dot {
            width: 20px; height: 20px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; flex-shrink: 0;
            border: 2px solid var(--gray-300);
        }
        .agent-step.active { color: var(--gray-800); font-weight: 500; }
        .agent-step.active .agent-dot { border-color: var(--primary); border-top-color: transparent; animation: agentSpin 0.7s linear infinite; }
        .agent-step.done { color: var(--success); }
        .agent-step.done .agent-dot { background: var(--success); border-color: var(--success); color: #fff; }
        .agent-step .agent-desc { font-size: 12px; color: var(--gray-400); font-weight: 400; }
        @keyframes agentSpin { to { transform: rotate(360deg); } }

        /* ===== Exam Cards Grid ===== */
        .exam-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }

        .exam-card {
            background: #fff;
            border-radius: var(--radius-lg);
            border: 1px solid var(--gray-200);
            padding: 20px;
            transition: box-shadow 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
        }

        .exam-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--primary-light);
        }

        .exam-card .exam-topic {
            font-size: 16px;
            font-weight: 600;
            color: var(--gray-800);
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .exam-card .exam-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-easy { background: var(--green-bg); color: var(--green); }
        .badge-medium { background: var(--blue-bg); color: var(--blue); }
        .badge-hard { background: var(--danger-bg); color: var(--danger); }
        .badge-score { background: var(--primary-light); color: var(--primary); }

        .badge-in-progress { background: var(--blue-bg); color: var(--blue); }
        .badge-submitted { background: var(--warning-bg); color: var(--warning); }
        .badge-ai-graded { background: var(--purple-bg); color: var(--purple); }
        .badge-reviewed { background: var(--green-bg); color: var(--green); }
        .badge-published { background: var(--green-bg); color: var(--green); }

        .exam-card .exam-time {
            font-size: 13px;
            color: var(--gray-500);
            margin-bottom: 14px;
        }

        .exam-card .exam-actions {
            margin-top: auto;
        }

        /* ===== Session List ===== */
        .session-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .session-item {
            background: #fff;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: box-shadow 0.2s;
        }

        .session-item:hover { box-shadow: var(--shadow); }

        .session-info {
            flex: 1;
            min-width: 0;
        }

        .session-info .session-topic {
            font-weight: 600;
            font-size: 15px;
            color: var(--gray-800);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .session-info .session-meta {
            font-size: 13px;
            color: var(--gray-500);
            margin-top: 2px;
        }

        .session-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        /* ===== Exam Taking Page ===== */
        .exam-page { display: none; }

        .exam-topbar {
            background: #fff;
            border-bottom: 1px solid var(--gray-200);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .exam-topbar .exam-title-area {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .exam-topbar .exam-title-area h2 {
            font-size: 17px;
            font-weight: 600;
        }

        .timer {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            background: var(--primary-light);
            padding: 6px 16px;
            border-radius: 999px;
        }

        .timer.warning { color: var(--danger); background: var(--danger-bg); }

        .exam-topbar .topbar-actions {
            display: flex;
            gap: 10px;
        }

        .exam-body {
            display: flex;
            gap: 24px;
            max-width: 1200px;
            margin: 24px auto;
            padding: 0 24px;
        }

        /* Question Nav Sidebar */
        .question-nav {
            width: 220px;
            flex-shrink: 0;
        }

        .question-nav-card {
            background: #fff;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-lg);
            padding: 16px;
            position: sticky;
            top: 80px;
        }

        .question-nav-card h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 12px;
        }

        .question-nav-grid {
            margin-bottom: 16px;
        }

        .q-nav-btn {
            width: 100%;
            aspect-ratio: 1;
            border: 1px solid var(--gray-300);
            border-radius: var(--radius);
            background: #fff;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            color: var(--gray-600);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .q-nav-btn:hover { border-color: var(--primary); color: var(--primary); }
        .q-nav-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .q-nav-btn.answered { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }

        .nav-type-group {
            margin-bottom: 12px;
        }

        .nav-type-group:last-of-type {
            margin-bottom: 16px;
        }

        .nav-type-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--gray-500);
            margin-bottom: 6px;
            padding-left: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .nav-type-label .type-count {
            font-weight: 400;
            color: var(--gray-400);
        }

        .nav-type-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        .nav-type-divider {
            height: 1px;
            background: var(--gray-200);
            margin: 10px 0;
        }

        .nav-legend {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 12px;
            color: var(--gray-500);
        }

        .nav-legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            border: 1px solid var(--gray-300);
        }

        .nav-legend-dot.dot-active { background: var(--primary); border-color: var(--primary); }
        .nav-legend-dot.dot-answered { background: var(--primary-light); border-color: var(--primary); }
        .nav-legend-dot.dot-unanswered { background: #fff; }

        /* Question Area */
        .question-area {
            flex: 1;
            min-width: 0;
        }

        .question-card {
            position: relative;
            background: #fff;
            border: 1px solid var(--gray-200);
            border-top: 3px solid var(--primary);
            border-radius: var(--radius-lg);
            padding: 26px 28px 28px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }

        .question-header {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            margin-bottom: 4px;
        }

        .question-number {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            min-width: 38px;
            height: 38px;
            padding: 0 10px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            font-weight: 700;
            line-height: 1;
            flex-shrink: 0;
            box-shadow: 0 4px 10px var(--primary-ring);
        }

        .question-title-area { flex: 1; min-width: 0; }

        .question-type-badge {
            display: inline-block;
            font-size: 12px;
            font-weight: 600;
            color: var(--primary-dark);
            background: var(--primary-light);
            padding: 3px 12px;
            border-radius: 999px;
            margin-bottom: 10px;
            letter-spacing: .3px;
        }

        .question-content {
            font-size: 16px;
            line-height: 1.95;
            color: var(--gray-800);
            white-space: pre-wrap;
            letter-spacing: .2px;
            border-left: 3px solid var(--gray-200);
            padding: 2px 0 2px 16px;
            margin-left: 1px;
        }

        /* 看图题配图（来自题库文档抽取的图片，按题号绑定注入 snapshot 的 q.images） */
        .question-images {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 12px 0 0 16px;
        }

        .question-image {
            max-width: 320px;
            max-height: 260px;
            width: auto;
            height: auto;
            object-fit: contain;
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            background: var(--gray-50);
            cursor: zoom-in;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .06);
            transition: box-shadow .15s ease, transform .15s ease;
        }

        .question-image:hover {
            box-shadow: 0 4px 14px rgba(0, 0, 0, .14);
        }

        /* 点击放大查看 */
        .q-image-lightbox {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, .82);
            padding: 24px;
        }

        .q-image-lightbox.open {
            display: flex;
        }

        .q-image-lightbox img {
            max-width: 92vw;
            max-height: 92vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, .5);
        }

        .q-image-lightbox .q-image-close {
            position: absolute;
            top: 18px;
            right: 24px;
            font-size: 34px;
            line-height: 1;
            color: #fff;
            cursor: pointer;
            user-select: none;
        }

        .question-score {
            font-size: 13px;
            font-weight: 600;
            color: var(--gray-600);
            background: var(--gray-100);
            border: 1px solid var(--gray-200);
            padding: 4px 12px;
            border-radius: 999px;
            flex-shrink: 0;
            white-space: nowrap;
        }

        /* Answer Controls */
        .answer-controls {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed var(--gray-200);
        }

        .answer-controls::before {
            content: "作答区";
            display: inline-block;
            font-size: 12px;
            font-weight: 600;
            color: var(--gray-500);
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            border-radius: 999px;
            padding: 3px 12px;
            margin-bottom: 14px;
        }

        .option-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .option-item {
            display: flex;
            width: 100%;
            align-items: center;
            gap: 14px;
            padding: 15px 18px;
            border: 1.5px solid var(--gray-200);
            border-radius: var(--radius);
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s, box-shadow 0.15s, transform 0.05s;
            background: #fff;
            min-height: 52px;
            box-shadow: var(--shadow-sm);
        }

        .option-item:hover { border-color: var(--primary); background: var(--primary-light); transform: translateY(-1px); }
        .option-item.selected {
            border-color: var(--primary);
            background: var(--primary-light);
            box-shadow: 0 0 0 1px var(--primary), var(--shadow-sm);
        }

        .option-item input[type="radio"],
        .option-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin: 0;
            flex-shrink: 0;
            accent-color: var(--primary);
            pointer-events: none;
        }

        .option-item label {
            cursor: pointer;
            font-size: 15px;
            line-height: 1.6;
            flex: 1;
            word-break: break-word;
            color: var(--gray-700);
        }

        .option-item.selected label { color: var(--gray-900); }

        .option-item label strong {
            display: inline-block;
            min-width: 22px;
            height: 22px;
            line-height: 22px;
            text-align: center;
            margin-right: 8px;
            font-size: 13px;
            color: var(--primary-dark);
            background: var(--primary-light);
            border: 1px solid var(--primary-ring);
            border-radius: 6px;
        }

        .option-item.selected label strong {
            color: #fff;
            background: var(--primary);
            border-color: var(--primary);
        }

        .answer-textarea {
            width: 100%;
            border: 1.5px solid var(--gray-300);
            border-radius: var(--radius);
            padding: 14px 16px;
            font-size: 15px;
            font-family: inherit;
            resize: vertical;
            outline: none;
            background: var(--gray-50);
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
            line-height: 1.7;
        }

        .answer-textarea:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px var(--primary-ring);
        }

        .answer-textarea.small { min-height: 92px; }
        .answer-textarea.large { min-height: 190px; }

        .answer-input {
            width: 100%;
            border: 1.5px solid var(--gray-300);
            border-radius: var(--radius);
            padding: 13px 16px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            background: var(--gray-50);
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
        }

        .answer-input:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px var(--primary-ring);
        }

        /* Multi-blank answer area (labeled blanks, grouped by sub-question) */
        .blank-content {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 4px 2px 2px;
        }

        .blank-group {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .blank-group-tag {
            font-size: 13px;
            font-weight: 600;
            color: var(--primary-dark);
            background: var(--primary-light);
            border-radius: 999px;
            padding: 4px 13px;
            flex-shrink: 0;
            min-width: 20px;
            text-align: center;
        }

        .blank-group-fields {
            display: inline-flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 6px 14px;
        }

        .blank-inline-input {
            display: inline-block;
            min-width: 170px;
            width: min(320px, 56vw);
            border: none;
            border-bottom: 2px solid var(--gray-300);
            padding: 3px 10px;
            margin: 0 3px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            background: #fff;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
            vertical-align: baseline;
            text-align: left;
            border-radius: 6px 6px 0 0;
        }

        .blank-inline-input:focus {
            border-bottom-color: var(--primary);
            background: var(--primary-light);
            box-shadow: 0 2px 0 var(--primary-ring);
        }

        .blank-inline-input.filled {
            border-bottom-color: var(--primary);
            background: #fff;
            font-weight: 600;
            color: var(--primary-dark);
        }

        .blank-label {
            display: inline-block;
            font-size: 12px;
            font-weight: 600;
            color: var(--primary-dark);
            background: var(--primary-light);
            border-radius: 6px;
            padding: 1px 7px;
            margin-right: 4px;
            vertical-align: baseline;
        }

        .multi-blank-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .multi-blank-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .multi-blank-item .blank-num {
            font-size: 13px;
            font-weight: 600;
            color: var(--gray-500);
            min-width: 48px;
            flex-shrink: 0;
        }

        .multi-blank-item .answer-input {
            flex: 1;
        }

        .question-nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--gray-100);
        }

        /* ===== Results Page ===== */
        .results-page { display: none; }

        .results-container {
            max-width: 900px;
            margin: 24px auto;
            padding: 0 24px;
        }

        .results-header {
            background: #fff;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-lg);
            padding: 32px;
            text-align: center;
            margin-bottom: 24px;
        }

        .results-header h2 {
            font-size: 22px;
            margin-bottom: 20px;
            color: var(--gray-800);
        }

        .score-cards {
            display: flex;
            justify-content: center;
            gap: 32px;
            flex-wrap: wrap;
        }

        .score-card {
            text-align: center;
        }

        .score-card .score-value {
            font-size: 36px;
            font-weight: 700;
            color: var(--primary);
        }

        .score-card .score-value.high { color: var(--success); }
        .score-card .score-value.low { color: var(--danger); }

        .score-card .score-label {
            font-size: 13px;
            color: var(--gray-500);
            margin-top: 4px;
        }

        .results-breakdown {
            background: #fff;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .results-breakdown h3 {
            padding: 16px 24px;
            font-size: 17px;
            font-weight: 600;
            border-bottom: 1px solid var(--gray-200);
        }

        .result-question {
            padding: 20px 24px;
            border-bottom: 1px solid var(--gray-100);
        }

        .result-question:last-child { border-bottom: none; }

        .result-question.correct { border-left: 3px solid var(--success); }
        .result-question.wrong { border-left: 3px solid var(--danger); }
        .result-question.partial { border-left: 3px solid var(--warning); }

        .result-q-header {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 10px;
        }

        .result-q-content {
            font-size: 14px;
            line-height: 1.7;
            color: var(--gray-700);
            margin-bottom: 12px;
            white-space: pre-wrap;
        }

        .result-detail-grid {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 6px 12px;
            font-size: 13px;
        }

        .result-detail-grid .label {
            color: var(--gray-500);
            font-weight: 500;
            white-space: nowrap;
        }

        .result-detail-grid .value {
            color: var(--gray-700);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .result-detail-grid .value.correct-text { color: var(--success); }
        .result-detail-grid .value.wrong-text { color: var(--danger); }

        .result-score-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
        }

        .result-score-badge.full { background: var(--success-bg); color: var(--success); }
        .result-score-badge.zero { background: var(--danger-bg); color: var(--danger); }
        .result-score-badge.partial { background: var(--warning-bg); color: var(--warning); }

        /* ===== Modal ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.show { display: flex; }

        .modal {
            background: #fff;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            max-width: 440px;
            width: 100%;
            padding: 24px;
        }

        .modal h3 {
            font-size: 18px;
            margin-bottom: 12px;
        }

        .modal p {
            font-size: 14px;
            color: var(--gray-600);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        /* ===== Toast ===== */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: 12px 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: toast-in 0.3s ease;
            max-width: 360px;
        }

        .toast.success { border-left: 3px solid var(--success); }
        .toast.error { border-left: 3px solid var(--danger); }
        .toast.info { border-left: 3px solid var(--blue); }

        @keyframes toast-in {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* ===== Loading ===== */
        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid var(--gray-300);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: var(--gray-500);
        }

        .empty-state .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .empty-state p {
            font-size: 15px;
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .exam-body {
                flex-direction: column;
                padding: 0 12px;
            }

            .question-nav {
                width: 100%;
            }

            .question-nav-card {
                position: static;
            }

            .question-nav-grid {
                grid-template-columns: repeat(8, 1fr);
            }

            .nav-type-grid {
                grid-template-columns: repeat(8, 1fr);
            }

            .exam-grid {
                grid-template-columns: 1fr;
            }

            .app-content { padding: 16px; }

            .score-cards { gap: 16px; }

            .exam-topbar {
                padding: 10px 12px;
                flex-wrap: wrap;
                gap: 8px;
            }

            .exam-topbar .exam-title-area h2 {
                font-size: 15px;
            }

            .results-container { padding: 0 12px; }

            .session-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .question-card { padding: 18px 16px 20px; }
            .question-content { font-size: 15px; line-height: 1.8; padding-left: 12px; }
            .question-number { min-width: 32px; height: 32px; font-size: 15px; border-radius: 10px; }
            .blank-group { gap: 8px; }
            .blank-inline-input { min-width: 130px; width: min(260px, 66vw); padding: 3px 6px; }
        }
    </style>
</head>
<body>

<!-- ===== Toast Container ===== -->
<div class="toast-container" id="toastContainer"></div>

<!-- ===== Auth Page ===== -->
<div class="auth-container" id="authPage">
    <div class="auth-card">
        <div class="auth-header">
            <h1>在线考试系统</h1>
            <p>欢迎使用智能考试平台</p>
        </div>
        <div class="auth-tabs">
            <button class="auth-tab active" onclick="switchAuthTab('login')">登录</button>
            <button class="auth-tab" onclick="switchAuthTab('register')">注册</button>
        </div>
        <div class="auth-error" id="authError"></div>

        <!-- Login Form -->
        <form class="auth-form" id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="loginUsername">用户名</label>
                <input id="loginUsername" placeholder="请输入用户名" required type="text">
            </div>
            <div class="form-group">
                <label for="loginPassword">密码</label>
                <input id="loginPassword" placeholder="请输入密码" required type="password">
            </div>
            <button class="btn btn-primary" id="loginBtn" type="submit">登录</button>
        </form>

        <!-- Register Form -->
        <form class="auth-form hidden" id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="regUsername">用户名</label>
                <input id="regUsername" placeholder="请输入用户名" required type="text">
            </div>
            <div class="form-group">
                <label for="regPassword">密码</label>
                <input id="regPassword" placeholder="请输入密码" required type="password">
            </div>
            <div class="form-group">
                <label for="regDisplayName">姓名</label>
                <input id="regDisplayName" placeholder="请输入真实姓名" type="text">
            </div>
            <div class="form-group">
                <label for="regStudentNo">学号</label>
                <input id="regStudentNo" placeholder="请输入学号" type="text">
            </div>
            <button class="btn btn-primary" id="registerBtn" type="submit">注册</button>
        </form>
    </div>
</div>

<!-- ===== Main App ===== -->
<div class="app-container" id="appContainer">
    <header class="app-header">
        <div class="logo">在线考试系统</div>
        <div class="user-info">
            <span>欢迎, <span class="user-name" id="headerUserName"></span></span>
            <button class="btn btn-outline btn-sm" onclick="handleLogout()">退出登录</button>
        </div>
    </header>

    <div class="app-content" id="examListPage">
        <!-- Page Menu -->
        <div class="page-menu">
            <button class="page-menu-item active" data-tab="exams" onclick="switchExamTab('exams')">
                <span>&#128218;</span> 可用考试
            </button>
            <button class="page-menu-item" data-tab="sessions" onclick="switchExamTab('sessions')">
                <span>&#128203;</span> 我的考试记录
            </button>
            <button class="page-menu-item" data-tab="wrongbook" onclick="switchExamTab('wrongbook')">
                <span>&#10060;</span> 我的错题本
            </button>
        </div>

        <!-- Panel: 可用考试 -->
        <div class="page-panel active" id="panel-exams">
            <div class="exam-grid" id="examGrid">
                <div class="empty-state">
                    <div class="empty-icon">
                        <div class="loading-spinner"></div>
                    </div>
                    <p>加载中...</p>
                </div>
            </div>
        </div>

        <!-- Panel: 我的考试记录 -->
        <div class="page-panel" id="panel-sessions">
            <div class="session-list" id="sessionList">
                <div class="empty-state">
                    <div class="empty-icon">
                        <div class="loading-spinner"></div>
                    </div>
                    <p>加载中...</p>
                </div>
            </div>
        </div>

        <!-- Panel: 我的错题本 -->
        <div class="page-panel" id="panel-wrongbook">
            <div class="section" style="margin-bottom:16px">
                <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
                    <div style="flex:1;min-width:160px">
                        <label style="font-size:13px;color:var(--gray-500);display:block;margin-bottom:4px" for="wbStudentTopic">主题关键词</label>
                        <input id="wbStudentTopic" placeholder="搜索考试主题..." style="width:100%;padding:8px 12px;border:1px solid var(--gray-200);border-radius:var(--radius);font-size:14px;font-family:inherit"
                               type="text">
                    </div>
                    <div style="flex:0 0 150px">
                        <label style="font-size:13px;color:var(--gray-500);display:block;margin-bottom:4px" for="wbStudentType">题型</label>
                        <select id="wbStudentType"
                                style="width:100%;padding:8px 12px;border:1px solid var(--gray-200);border-radius:var(--radius);font-size:14px;font-family:inherit;background:#fff">
                            <option value="">全部题型</option>
                            <option value="SINGLE_CHOICE">单选题</option>
                            <option value="MULTI_CHOICE">多选题</option>
                            <option value="TRUE_FALSE">判断题</option>
                            <option value="FILL_BLANK">填空题</option>
                            <option value="SHORT_ANSWER">简答题</option>
                            <option value="ESSAY">论述题</option>
                        </select>
                    </div>
                    <button class="btn btn-primary btn-sm" onclick="loadMyWrongAnswers(0)" style="height:38px">&#128269;
                        查询
                    </button>
                </div>
            </div>
            <div class="wb-stats" id="wbStats"></div>
            <div id="wbList">
                <div class="empty-state"><p>加载错题数据...</p></div>
            </div>
            <div class="pager" id="wbPager"></div>
        </div>
    </div>
</div>

<!-- ===== Exam Taking Page ===== -->
<div class="exam-page" id="examTakingPage">
    <div class="exam-topbar">
        <div class="exam-title-area">
            <h2 id="examTakingTitle">考试进行中</h2>
            <div class="timer" id="examTimer">
                <span>&#9202;</span>
                <span id="timerDisplay">00:00:00</span>
            </div>
        </div>
        <div class="topbar-actions">
            <button class="btn btn-secondary btn-sm" onclick="saveAnswers()">保存答案</button>
            <button class="btn btn-warning btn-sm" onclick="showSubmitConfirm()">交卷</button>
            <button class="btn btn-outline btn-sm" onclick="backToList()">返回列表</button>
        </div>
    </div>

    <div class="exam-body">
        <div class="question-nav">
            <div class="question-nav-card">
                <h3>题目导航</h3>
                <div class="question-nav-grid" id="questionNavGrid"></div>
                <div class="nav-legend">
                    <div class="nav-legend-item">
                        <div class="nav-legend-dot dot-active"></div>
                        <span>当前题目</span>
                    </div>
                    <div class="nav-legend-item">
                        <div class="nav-legend-dot dot-answered"></div>
                        <span>已作答</span>
                    </div>
                    <div class="nav-legend-item">
                        <div class="nav-legend-dot dot-unanswered"></div>
                        <span>未作答</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="question-area" id="questionArea">
            <!-- Questions rendered here -->
        </div>
    </div>
</div>

<!-- ===== Results Page ===== -->
<div class="results-page" id="resultsPage">
    <header class="app-header">
        <div class="logo">在线考试系统</div>
        <div class="user-info">
            <button class="btn btn-outline btn-sm" onclick="backToList()">返回列表</button>
        </div>
    </header>
    <div class="results-container" id="resultsContainer">
        <!-- Results rendered here -->
    </div>
</div>

<!-- ===== Submit Confirmation Modal ===== -->
<div class="modal-overlay" id="submitModal">
    <div class="modal">
        <h3>确认交卷</h3>
        <p id="submitModalText">确定要提交试卷吗？提交后将无法修改答案。</p>
        <div class="modal-actions">
            <button class="btn btn-secondary" onclick="closeSubmitModal()">继续答题</button>
            <button class="btn btn-warning" id="submitModalConfirm" onclick="submitExam()">确认交卷</button>
        </div>
    </div>
</div>

<script>
    /* ===== State ===== */
    let token = null;
    let currentUser = null;
    let examHistoryList = [];
    let mySessions = [];
    let currentSession = null;
    let currentQuestions = [];
    let currentAnswers = {};
    let timerInterval = null;
    let autoSaveInterval = null;
    let autoSubmitTimer = null;
    let currentQuestionIndex = 0;
    let examDurationMinutes = 0;
    /* ===== H5 可靠性状态 ===== */
    // 服务端时钟与本地时钟的差值（ms）。Date.now() + serverClockOffsetMs ≈ 服务端时刻，
    // 消除客户端时间漂移导致的倒计时提前 / 延后。
    let serverClockOffsetMs = 0;
    // 自动保存失败标记 + 短周期重试定时器：失败时不再静默吞掉，改为可见提示并每 15s 补一次。
    let autoSaveFailed = false;
    let autoSaveRetryTimer = null;
    // 提交在途守卫：手动点击 / 倒计时到点自动提交 / 二次弹窗都可能并发触发 submitExam，
    // 若不加锁会产生重复 save+submit 请求（后端 CAS 会拒绝，但用户看到"提交失败"混乱）。
    let isSubmitting = false;

    /* ===== Student Error Book State ===== */
    let wbSize = 10;
    let wbPage = 0;
    let wbTotal = 0;
    let wbLoaded = false;

    /* ===== Utility ===== */
    function showToast(message, type) {
        type = type || 'info';
        var container = document.getElementById('toastContainer');
        var toast = document.createElement('div');
        toast.className = 'toast ' + type;
        toast.textContent = message;
        container.appendChild(toast);
        setTimeout(function() {
            toast.remove();
        }, 3000);
    }

    function apiRequest(url, options) {
        options = options || {};
        var headers = options.headers || {};
        if (token) {
            headers['X-Student-Token'] = token;
        }
        if (options.body && typeof options.body === 'string') {
            headers['Content-Type'] = 'application/json';
        }
        options.headers = headers;
        return fetch(url, options).then(function(res) {
            if (!res.ok) {
                return res.text().then(function(text) {
                    var msg;
                    try { msg = JSON.parse(text).message || text; } catch(e) { msg = text; }
                    throw new Error(msg || ('请求失败: ' + res.status));
                });
            }
            var ct = res.headers.get('content-type');
            if (ct && ct.indexOf('application/json') !== -1) {
                return res.json();
            }
            return res.text();
        });
    }

    function formatDateTime(str) {
        if (!str) return '';
        var d = new Date(str);
        if (isNaN(d.getTime())) return str;
        var y = d.getFullYear();
        var m = String(d.getMonth() + 1).padStart(2, '0');
        var day = String(d.getDate()).padStart(2, '0');
        var h = String(d.getHours()).padStart(2, '0');
        var min = String(d.getMinutes()).padStart(2, '0');
        return y + '-' + m + '-' + day + ' ' + h + ':' + min;
    }

    function difficultyBadge(difficulty) {
        if (!difficulty) return '<span class="badge badge-easy">未知</span>';
        var d = difficulty.toUpperCase();
        if (d === 'EASY' || d === '简单') return '<span class="badge badge-easy">简单</span>';
        if (d === 'HARD' || d === '困难') return '<span class="badge badge-hard">困难</span>';
        return '<span class="badge badge-medium">中等</span>';
    }

    function statusBadge(status) {
        var map = {
            'IN_PROGRESS': ['badge-in-progress', '进行中'],
            'SUBMITTED': ['badge-submitted', '已提交'],
            'AI_GRADED': ['badge-ai-graded', 'AI已评分'],
            'REVIEWED': ['badge-reviewed', '已审阅'],
            'PUBLISHED': ['badge-published', '已发布']
        };
        var info = map[status] || ['badge-in-progress', status || '未知'];
        return '<span class="badge ' + info[0] + '">' + info[1] + '</span>';
    }

    function questionTypeLabel(type) {
        var map = {
            'SINGLE_CHOICE': '单选题',
            'MULTI_CHOICE': '多选题',
            'TRUE_FALSE': '判断题',
            'FILL_BLANK': '填空题',
            'SHORT_ANSWER': '简答题',
            'ESSAY': '论述题'
        };
        return map[type] || type;
    }

    /* ===== Auth ===== */
    function switchAuthTab(tab) {
        var tabs = document.querySelectorAll('.auth-tab');
        tabs.forEach(function(t) { t.classList.remove('active'); });
        if (tab === 'login') {
            tabs[0].classList.add('active');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('registerForm').classList.add('hidden');
        } else {
            tabs[1].classList.add('active');
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
        }
        document.getElementById('authError').style.display = 'none';
    }

    function showAuthError(msg) {
        var el = document.getElementById('authError');
        el.textContent = msg;
        el.style.display = 'block';
    }

    function handleLogin(e) {
        e.preventDefault();
        var username = document.getElementById('loginUsername').value.trim();
        var password = document.getElementById('loginPassword').value;
        if (!username || !password) {
            showAuthError('请输入用户名和密码');
            return;
        }
        var btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.textContent = '登录中...';
        apiRequest('/api/student/auth/login', {
            method: 'POST',
            body: JSON.stringify({ username: username, password: password })
        }).then(function(data) {
            token = data.token;
            return apiRequest('/api/student/auth/me');
        }).then(function(user) {
            currentUser = user;
            enterApp();
        }).catch(function(err) {
            showAuthError('登录失败: ' + err.message);
        }).finally(function() {
            btn.disabled = false;
            btn.textContent = '登录';
        });
    }

    function handleRegister(e) {
        e.preventDefault();
        var username = document.getElementById('regUsername').value.trim();
        var password = document.getElementById('regPassword').value;
        var displayName = document.getElementById('regDisplayName').value.trim();
        var studentNo = document.getElementById('regStudentNo').value.trim();
        if (!username || !password) {
            showAuthError('请输入用户名和密码');
            return;
        }
        var btn = document.getElementById('registerBtn');
        btn.disabled = true;
        btn.textContent = '注册中...';
        var body = { username: username, password: password };
        if (displayName) body.displayName = displayName;
        if (studentNo) body.studentNo = studentNo;
        apiRequest('/api/student/auth/register', {
            method: 'POST',
            body: JSON.stringify(body)
        }).then(function() {
            showToast('注册成功，请登录', 'success');
            switchAuthTab('login');
            document.getElementById('loginUsername').value = username;
        }).catch(function(err) {
            showAuthError('注册失败: ' + err.message);
        }).finally(function() {
            btn.disabled = false;
            btn.textContent = '注册';
        });
    }

    function handleLogout() {
        apiRequest('/api/student/auth/logout', { method: 'POST' }).catch(function() {});
        token = null;
        currentUser = null;
        stopTimer();
        stopAutoSave();
        clearAutoSubmitTimer();
        document.getElementById('authPage').style.display = '';
        document.getElementById('appContainer').style.display = 'none';
        document.getElementById('examTakingPage').style.display = 'none';
        document.getElementById('resultsPage').style.display = 'none';
        document.getElementById('loginUsername').value = '';
        document.getElementById('loginPassword').value = '';
    }

    /* ===== Enter App ===== */
    function enterApp() {
        document.getElementById('authPage').style.display = 'none';
        document.getElementById('appContainer').style.display = 'block';
        document.getElementById('examTakingPage').style.display = 'none';
        document.getElementById('resultsPage').style.display = 'none';
        document.getElementById('headerUserName').textContent = currentUser.displayName || currentUser.username;
        wbLoaded = false;
        showExamTab('exams');
        loadExamList();
        loadMySessions();
    }

    function backToList() {
        stopTimer();
        stopAutoSave();
        clearAutoSubmitTimer();
        currentSession = null;
        currentQuestions = [];
        currentAnswers = {};
        currentQuestionIndex = 0;
        document.getElementById('examTakingPage').classList.remove('exam-locked');
        document.getElementById('examTakingPage').style.display = 'none';
        document.getElementById('resultsPage').style.display = 'none';
        document.getElementById('appContainer').style.display = 'block';
        wbLoaded = false;
        showExamTab('exams');
        loadExamList();
        loadMySessions();
    }

    /* ===== Exam Home Page Menu ===== */
    function switchExamTab(tab) {
        showExamTab(tab);
        if (tab === 'exams') {
            loadExamList();
        } else if (tab === 'sessions') {
            loadMySessions();
        } else if (tab === 'wrongbook') {
            if (!wbLoaded) {
                loadMyWrongAnswers(0);
                wbLoaded = true;
            }
        }
    }

    function showExamTab(tab) {
        document.querySelectorAll('.page-menu-item').forEach(function(el) {
            el.classList.toggle('active', el.getAttribute('data-tab') === tab);
        });
        document.querySelectorAll('.page-panel').forEach(function(el) {
            el.classList.toggle('active', el.id === 'panel-' + tab);
        });
    }

    /* ===== Load Exam List ===== */
    function loadExamList() {
        var grid = document.getElementById('examGrid');
        grid.innerHTML = '<div class="empty-state"><div class="empty-icon"><div class="loading-spinner"></div></div><p>加载中...</p></div>';
        apiRequest('/api/exam/available?limit=50')
            .then(function(data) {
                examHistoryList = Array.isArray(data) ? data : (data.list || data.data || []);
                renderExamGrid();
            })
            .catch(function(err) {
                grid.innerHTML = '<div class="empty-state"><p>加载失败: ' + err.message + '</p></div>';
            });
    }

    function renderExamGrid() {
        var grid = document.getElementById('examGrid');
        if (!examHistoryList || examHistoryList.length === 0) {
            grid.innerHTML = '<div class="empty-state"><div class="empty-icon">&#128218;</div><p>暂无可用考试</p></div>';
            return;
        }
        var html = '';
        examHistoryList.forEach(function(exam) {
            var qualityHtml = '';
            if (exam.qualityScore != null) {
                qualityHtml = '<span class="badge badge-score">质量 ' + Number(exam.qualityScore).toFixed(1) + '</span>';
            }
            html += '<div class="exam-card">'
                + '<div class="exam-topic">' + escapeHtml(exam.topic || '未命名主题') + '</div>'
                + '<div class="exam-meta">'
                + difficultyBadge(exam.difficulty)
                + qualityHtml
                + '</div>'
                + '<div class="exam-time">' + formatDateTime(exam.createTime) + '</div>'
                + '<div class="exam-actions">'
                + '<button class="btn btn-primary btn-sm" onclick="startExam(\'' + exam.sessionId + '\')">开始考试</button>'
                + '</div>'
                + '</div>';
        });
        grid.innerHTML = html;
    }

    /* ===== Load My Sessions ===== */
    function loadMySessions() {
        var list = document.getElementById('sessionList');
        list.innerHTML = '<div class="empty-state"><div class="empty-icon"><div class="loading-spinner"></div></div><p>加载中...</p></div>';
        apiRequest('/api/exam/my-sessions')
            .then(function(data) {
                mySessions = Array.isArray(data) ? data : (data.list || data.data || []);
                renderSessionList();
            })
            .catch(function(err) {
                list.innerHTML = '<div class="empty-state"><p>加载失败: ' + err.message + '</p></div>';
            });
    }

    function renderSessionList() {
        var list = document.getElementById('sessionList');
        if (!mySessions || mySessions.length === 0) {
            list.innerHTML = '<div class="empty-state"><div class="empty-icon">&#128203;</div><p>暂无考试记录</p></div>';
            return;
        }
        var html = '';
        mySessions.forEach(function(session) {
            var status = session.status || 'IN_PROGRESS';
            var actionHtml = '';
            if (status === 'IN_PROGRESS') {
                actionHtml = '<button class="btn btn-primary btn-sm" onclick="resumeExam(\'' + session.sessionKey + '\')">继续答题</button>';
            } else if (status === 'SUBMITTED' || status === 'AI_GRADED') {
                actionHtml = '<button class="btn btn-secondary btn-sm" disabled>等待评分</button>';
            } else if (status === 'REVIEWED' || status === 'PUBLISHED') {
                actionHtml = '<button class="btn btn-success btn-sm" onclick="viewResults(\'' + session.sessionKey + '\')">查看成绩</button>';
            }
            html += '<div class="session-item">'
                + '<div class="session-info">'
                + '<div class="session-topic">' + escapeHtml(session.topic || '未命名考试') + '</div>'
                + '<div class="session-meta">' + formatDateTime(session.startTime || session.createTime) + '</div>'
                + '</div>'
                + '<div class="session-actions">'
                + (session.voided ? '<span class="badge" style="background:#fee2e2;color:#b91c1c;margin-right:6px">试卷已作废</span>' : '')
                + statusBadge(status)
                + (session.totalScore != null ? ' <span class="badge badge-score">' + session.totalScore + '分</span>' : '')
                + actionHtml
                + '</div>'
                + '</div>';
        });
        list.innerHTML = html;
    }

    /* ===== Student Error Book ===== */
    var WB_TYPE_LABELS = {
        'SINGLE_CHOICE': '单选题', 'MULTI_CHOICE': '多选题', 'TRUE_FALSE': '判断题',
        'FILL_BLANK': '填空题', 'SHORT_ANSWER': '简答题', 'ESSAY': '论述题'
    };
    var WB_DIFF_LABELS = { 'EASY': '简单', 'MEDIUM': '中等', 'HARD': '困难' };

    function loadMyWrongAnswers(page) {
        if (page == null) page = wbPage;
        wbPage = page;
        var topicEl = document.getElementById('wbStudentTopic');
        var typeEl = document.getElementById('wbStudentType');
        var params = new URLSearchParams();
        if (topicEl && topicEl.value.trim()) params.set('topic', topicEl.value.trim());
        if (typeEl && typeEl.value) params.set('questionType', typeEl.value);
        params.set('page', page);
        params.set('size', wbSize);

        var listEl = document.getElementById('wbList');
        listEl.innerHTML = '<div class="empty-state"><div class="empty-icon"><div class="loading-spinner"></div></div><p>加载中...</p></div>';
        document.getElementById('wbStats').innerHTML = '';
        document.getElementById('wbPager').innerHTML = '';

        apiRequest('/api/student/wrong-answers?' + params.toString())
            .then(function(data) {
                var records = data.records || [];
                wbTotal = data.total || 0;
                renderWbStats(data.stats || {});
                renderWbList(records);
                renderWbPager(page, wbTotal);
            })
            .catch(function(err) {
                listEl.innerHTML = '<div class="empty-state"><p>加载失败: ' + escapeHtml(err.message) + '</p></div>';
            });
    }

    function goStudentWbPage(p) {
        loadMyWrongAnswers(p);
    }

    function renderWbStats(stats) {
        var el = document.getElementById('wbStats');
        var total = stats.totalCount || 0;
        if (total === 0) { el.innerHTML = ''; return; }
        var avgRate = Math.round((stats.avgScoreRate || 0) * 100);
        var topics = stats.topicCount || 0;
        el.innerHTML =
            '<div class="wb-stat-card"><div class="wb-stat-value" style="color:var(--danger)">' + total + '</div><div class="wb-stat-label">错题总数</div></div>' +
            '<div class="wb-stat-card"><div class="wb-stat-value">' + topics + '</div><div class="wb-stat-label">涉及主题</div></div>' +
            '<div class="wb-stat-card"><div class="wb-stat-value" style="color:' + (avgRate < 30 ? 'var(--danger)' : 'var(--warning)') + '">' + avgRate + '%</div><div class="wb-stat-label">平均得分率</div></div>';
    }

    function renderWbList(records) {
        var listEl = document.getElementById('wbList');
        if (!records || records.length === 0) {
            listEl.innerHTML = '<div class="empty-state"><div class="empty-icon">&#9989;</div><p>太棒了，暂无错题</p></div>';
            return;
        }
        var html = '';
        records.forEach(function(item) {
            var typeLabel = WB_TYPE_LABELS[item.questionType] || item.questionType || '-';
            var diffLabel = WB_DIFF_LABELS[item.difficulty] || item.difficulty || '';
            var isObjective = ['SINGLE_CHOICE', 'MULTI_CHOICE', 'TRUE_FALSE'].indexOf(item.questionType) >= 0;
            var scoreColor = item.effectiveScore === 0 ? 'var(--danger)' : 'var(--warning)';
            var scorePercent = item.maxScore > 0 ? Math.round(item.effectiveScore / item.maxScore * 100) : 0;
            var optionsHtml = '';
            if (item.optionsJson && isObjective) {
                try {
                    var options = JSON.parse(item.optionsJson);
                    if (Array.isArray(options) && options.length) {
                        optionsHtml = '<div class="wb-options">';
                        options.forEach(function(opt) {
                            var key = opt.key != null ? opt.key : opt.label;
                            var val = opt.value != null ? opt.value : opt.text;
                            var isCorrect = item.correctAnswer && key === item.correctAnswer;
                            var isMyPick = item.studentAnswer && key === item.studentAnswer && !isCorrect;
                            var cls = 'wb-option' + (isCorrect ? ' correct' : (isMyPick ? ' wrong' : ''));
                            optionsHtml += '<span class="' + cls + '">' + escapeHtml(key) + '. ' + escapeHtml(val) + '</span>';
                        });
                        optionsHtml += '</div>';
                    }
                } catch (e) { /* ignore */ }
            }

            var explainHtml = '';
            if (item.analysis || item.scoringCriteria) {
                explainHtml += '<details class="wb-explain"' + (item.analysis ? ' open' : '') + '>'
                    + '<summary>解析与评分标准</summary>';
                if (item.analysis) {
                    explainHtml += '<div class="wb-explain-title">解析</div>'
                        + '<div class="wb-explain-body" style="white-space:pre-line">' + escapeHtml(item.analysis) + '</div>';
                }
                if (item.scoringCriteria) {
                    explainHtml += '<div class="wb-explain-title">评分标准</div>'
                        + '<div class="wb-explain-body" style="white-space:pre-line">' + escapeHtml(item.scoringCriteria) + '</div>';
                }
                explainHtml += '</details>';
            }

            html += '<div class="wb-card" style="border-left-color:' + scoreColor + '">'
                + '<div class="wb-head">'
                + '<div class="wb-tags">'
                + '<span class="wb-badge type">' + escapeHtml(typeLabel) + '</span>'
                + '<span class="wb-badge topic">' + escapeHtml(item.topic || '') + '</span>'
                + (diffLabel ? '<span class="wb-badge diff">' + escapeHtml(diffLabel) + '</span>' : '')
                + '<span style="font-size:12px;color:var(--gray-500)">第 ' + (item.questionIndex || '-') + ' 题</span>'
                + '</div>'
                + '<div class="wb-score" style="color:' + scoreColor + '">' + item.effectiveScore + ' <span style="font-size:13px;color:var(--gray-500);font-weight:400">/ ' + item.maxScore + '分 · 得分率 ' + scorePercent + '%</span></div>'
                + '</div>'
                + '<div class="wb-question">' + escapeHtml(item.questionContent || '') + '</div>'
                + renderQuestionImages(item.images)
                + optionsHtml
                + '<div class="wb-answer-grid">'
                + '<div class="wb-answer mine"><div class="wb-answer-label">我的答案</div>' + escapeHtml(item.studentAnswer || '（未作答）') + '</div>'
                + '<div class="wb-answer right"><div class="wb-answer-label">正确答案</div>' + escapeHtml(item.correctAnswer || '（无标准答案）') + '</div>'
                + '</div>'
                + (item.aiFeedback ? '<div class="wb-feedback"><strong>AI 反馈：</strong>' + escapeHtml(item.aiFeedback) + '</div>' : '')
                + explainHtml
                + '<div class="wb-foot"><span>继续练习，攻克薄弱知识点</span><span>' + formatDateTime(item.submitTime) + '</span></div>'
                + '</div>';
        });
        listEl.innerHTML = html;
    }

    function renderWbPager(page, total) {
        var el = document.getElementById('wbPager');
        if (!total || total <= wbSize) { el.innerHTML = ''; return; }
        var totalPages = Math.ceil(total / wbSize);
        var cur = Math.min(page, totalPages - 1);
        var from = cur * wbSize + 1;
        var to = Math.min(total, (cur + 1) * wbSize);
        el.innerHTML =
            '<span class="pager-info">共 ' + total + ' 道错题 · 第 ' + (cur + 1) + '/' + totalPages + ' 页（' + from + '-' + to + '）</span>' +
            '<span class="pager-btns">' +
            '<button class="pager-btn" ' + (cur <= 0 ? 'disabled' : 'onclick="goStudentWbPage(' + (cur - 1) + ')"') + '>上一页</button>' +
            '<button class="pager-btn" ' + (cur >= totalPages - 1 ? 'disabled' : 'onclick="goStudentWbPage(' + (cur + 1) + ')"') + '>下一页</button>' +
            '</span>';
    }

    /* ===== Start Exam ===== */
    function renderPrepareSteps(active) {
        function state(name) {
            if (active === 'done') return 'done';
            if (active === 'validate' && name === 'render') return 'done';
            if (active === name) return 'active';
            return '';
        }
        function dot(s) { return s === 'done' ? '&#10003;' : ''; }
        var r = state('render'), v = state('validate');
        return '<div class="agent-steps">'
            + '<div class="agent-steps-title">正在准备试卷</div>'
            + '<div class="agent-step ' + r + '"><span class="agent-dot">' + dot(r) + '</span>'
            + '<div>试卷内容渲染 Agent<div class="agent-desc">结构化解析题目、补齐题号与选项、修复渲染格式</div></div></div>'
            + '<div class="agent-step ' + v + '"><span class="agent-dot">' + dot(v) + '</span>'
            + '<div>试卷内容校验 Agent<div class="agent-desc">校验题干完整性、选项数量、题号连续性与分值</div></div></div>'
            + '</div>';
    }

    function startExam(historySessionId) {
        document.getElementById('appContainer').style.display = 'none';
        document.getElementById('examTakingPage').style.display = 'block';
        document.getElementById('examTakingTitle').textContent = '准备试卷中...';
        document.getElementById('questionArea').innerHTML = renderPrepareSteps('render');
        document.getElementById('questionNavGrid').innerHTML = '';

        apiRequest('/api/exam/start', {
            method: 'POST',
            body: JSON.stringify({ token: token, historySessionId: historySessionId })
        }).then(function(data) {
            // 渲染完成，进入校验步骤
            document.getElementById('questionArea').innerHTML = renderPrepareSteps('validate');

            setTimeout(function() {
                document.getElementById('questionArea').innerHTML = renderPrepareSteps('done');

                currentSession = data;
                currentQuestionIndex = 0;
                currentAnswers = {};
                document.getElementById('examTakingTitle').textContent = data.topic || '考试进行中';

                var questions = [];
                if (data.questionsJson) {
                    if (typeof data.questionsJson === 'string') {
                        questions = JSON.parse(data.questionsJson);
                    } else {
                        questions = data.questionsJson;
                    }
                }
                currentQuestions = questions;

                // 展示校验结果
                var val = data.validation;
                if (val && val.pass === false) {
                    showToast('试卷校验未通过：' + (val.errors || []).join('；'), 'error');
                    backToList();
                    return;
                }
                if (val) {
                    showToast('试卷校验通过 · 共 ' + val.questionCount + ' 题 · 总分 ' + val.totalMaxScore, 'success');
                    if (val.warnings && val.warnings.length) {
                        showToast('提示：' + val.warnings.join('；'), 'info');
                    }
                }

                renderQuestionNav();
                renderQuestion(0);
                startTimer(data.startTime, data.durationMinutes, data.serverNow);
                startAutoSave();
            }, 600);
        }).catch(function(err) {
            showToast('开始考试失败: ' + err.message, 'error');
            backToList();
        });
    }

    function resumeExam(sessionKey) {
        document.getElementById('appContainer').style.display = 'none';
        document.getElementById('examTakingPage').style.display = 'block';
        document.getElementById('examTakingTitle').textContent = '加载中...';
        document.getElementById('questionArea').innerHTML = '<div class="empty-state"><div class="loading-spinner"></div><p>正在加载试卷...</p></div>';

        Promise.all([
            apiRequest('/api/exam/' + sessionKey),
            apiRequest('/api/exam/' + sessionKey + '/answers')
        ]).then(function(results) {
            var session = results[0];
            var answers = results[1];
            currentSession = session;
            currentQuestionIndex = 0;
            currentAnswers = {};

            var questions = [];
            if (session.questionsJson) {
                if (typeof session.questionsJson === 'string') {
                    questions = JSON.parse(session.questionsJson);
                } else {
                    questions = session.questionsJson;
                }
            }
            currentQuestions = questions;

            if (Array.isArray(answers)) {
                answers.forEach(function(a) {
                    // 服务端 DTO 字段为 studentAnswer，须归一化为本地作答模型 {answer}，
                    // 否则 renderQuestion / buildFullAnswersList 读 a.answer 得 undefined，
                    // 续答自动保存会回传空串覆盖学生此前已保存的答案（数据损毁）。
                    currentAnswers[a.questionIndex] = {
                        questionIndex: a.questionIndex,
                        questionType: a.questionType,
                        answer: a.studentAnswer != null ? a.studentAnswer : ''
                    };
                });
            }
