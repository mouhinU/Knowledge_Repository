            document.getElementById('examTakingTitle').textContent = session.topic || '考试进行中';
            renderQuestionNav();
            renderQuestion(0);
            startTimer(session.startTime, session.durationMinutes, session.serverNow);
            startAutoSave();
        }).catch(function(err) {
            showToast('加载考试失败: ' + err.message, 'error');
            backToList();
        });
    }

    /* ===== Timer (Countdown or Elapsed, server-clock-aligned) ===== */
    function startTimer(startTime, durationMinutes, serverNowIso) {
        stopTimer();
        clearAutoSubmitTimer();
        examDurationMinutes = durationMinutes || 0;

        // 校正本地时钟：以服务端为基准，之后所有 now() 与 deadline 比较都用校准后的时间。
        // 未提供 serverNow（旧版接口 / 缓存兜底）时偏移保持为 0，退化为纯本地时钟。
        if (serverNowIso) {
            var sn = new Date(serverNowIso).getTime();
            if (!isNaN(sn)) {
                serverClockOffsetMs = sn - Date.now();
            }
        }
        function now() { return Date.now() + serverClockOffsetMs; }

        var start = new Date(startTime).getTime();
        var timerEl = document.getElementById('timerDisplay');
        var timerContainer = document.getElementById('examTimer');

        if (examDurationMinutes > 0) {
            // 倒计时模式
            var totalSeconds = examDurationMinutes * 60;
            var deadline = start + totalSeconds * 1000;

            function updateCountdown() {
                var remaining = Math.max(0, Math.floor((deadline - now()) / 1000));

                var h = String(Math.floor(remaining / 3600)).padStart(2, '0');
                var m = String(Math.floor((remaining % 3600) / 60)).padStart(2, '0');
                var s = String(remaining % 60).padStart(2, '0');
                timerEl.textContent = h + ':' + m + ':' + s;

                // 更新颜色
                timerContainer.classList.remove('timer-warning', 'timer-danger');
                if (remaining <= 60) {
                    timerContainer.classList.add('timer-danger');
                } else if (remaining <= 300) {
                    timerContainer.classList.add('timer-warning');
                }

                // 时间到
                if (remaining <= 0) {
                    stopTimer();
                    onTimeExpired();
                }
            }
            updateCountdown();
            timerInterval = setInterval(updateCountdown, 1000);
        } else {
            // 正计时模式（不限时）
            function updateElapsed() {
                var elapsed = Math.floor((now() - start) / 1000);
                var h = String(Math.floor(elapsed / 3600)).padStart(2, '0');
                var m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
                var s = String(elapsed % 60).padStart(2, '0');
                timerEl.textContent = h + ':' + m + ':' + s;
            }
            updateElapsed();
            timerInterval = setInterval(updateElapsed, 1000);
        }
    }

    function onTimeExpired() {
        // 锁定答题区
        document.getElementById('examTakingPage').classList.add('exam-locked');

        // 弹出交卷确认框
        var answered = Object.keys(currentAnswers).length;
        var total = currentQuestions.length;
        var text = '考试时间已到！';
        if (answered < total) {
            text += ' 您还有 ' + (total - answered) + ' 道题未作答。';
        }
        text += ' 将在 30 秒后自动提交。';
        document.getElementById('submitModalText').textContent = text;
        document.getElementById('submitModal').classList.add('show');

        // 30 秒后自动提交
        autoSubmitTimer = setTimeout(function() {
            submitExam();
        }, 30000);
    }

    function clearAutoSubmitTimer() {
        if (autoSubmitTimer) {
            clearTimeout(autoSubmitTimer);
            autoSubmitTimer = null;
        }
    }

    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    /* ===== Auto Save ===== */
    function startAutoSave() {
        stopAutoSave();
        autoSaveInterval = setInterval(function() {
            silentSave();
        }, 60000);
        // 关闭 / 刷新 / 切前后台前尽力落一次，防止答案丢失。beforeunload 只给极短时间，
        // 用 sendBeacon（浏览器保证在页面卸载后仍完成该请求）而非 fetch。
        window.addEventListener('beforeunload', flushOnUnload);
    }

    function silentSave() {
        saveAnswers(true).then(function() {
            // 成功：清除失败标记，取消可能挂起的短周期重试。
            if (autoSaveFailed) {
                autoSaveFailed = false;
                showToast('答案已重新同步', 'success');
            }
            clearTimeout(autoSaveRetryTimer);
            autoSaveRetryTimer = null;
        }).catch(function() {
            // 静默自动保存失败不再吞掉：首次失败提示用户，并每 15s 快速重试，
            // 直到成功或用户手动保存 / 交卷（交卷前的 save 失败会直接阻断提交）。
            if (!autoSaveFailed) {
                autoSaveFailed = true;
                showToast('自动保存失败，正在重试…（请保持网络畅通，或手动点“保存答案”）', 'warning');
            }
            clearTimeout(autoSaveRetryTimer);
            autoSaveRetryTimer = setTimeout(silentSave, 15000);
        });
    }

    function flushOnUnload() {
        if (!currentSession || isSubmitting) return;
        if (typeof navigator === 'undefined' || !navigator.sendBeacon) return;
        try {
            saveCurrentAnswer();
            var answersList = buildFullAnswersList();
            if (!answersList.length) return;
            var blob = new Blob([JSON.stringify({ token: token, answers: answersList })],
                    { type: 'application/json' });
            navigator.sendBeacon('/api/exam/' + currentSession.sessionKey + '/save', blob);
        } catch (e) {
            // best-effort：卸载路径无法提示用户，静默即可
        }
    }

    function stopAutoSave() {
        if (autoSaveInterval) {
            clearInterval(autoSaveInterval);
            autoSaveInterval = null;
        }
        if (autoSaveRetryTimer) {
            clearTimeout(autoSaveRetryTimer);
            autoSaveRetryTimer = null;
        }
        autoSaveFailed = false;
        window.removeEventListener('beforeunload', flushOnUnload);
    }

    /* ===== Render Question Nav ===== */
    function renderQuestionNav() {
        var grid = document.getElementById('questionNavGrid');

        // 按题型分布方案的大题分组（sectionLabel），保持题目出现顺序；无标签回退内核题型
        var groups = [];
        var groupMap = {};
        currentQuestions.forEach(function(q, i) {
            var type = q.type || 'SHORT_ANSWER';
            var label = q.sectionLabel && q.sectionLabel.trim() ? q.sectionLabel.trim() : null;
            var gkey = label ? ('L:' + label) : ('T:' + type);
            if (!groupMap[gkey]) {
                groupMap[gkey] = { type: type, label: label, indices: [], score: 0 };
                groups.push(groupMap[gkey]);
            }
            groupMap[gkey].indices.push(i);
            groupMap[gkey].score += (q.maxScore || 0);
        });

        var html = '';
        groups.forEach(function(group, gi) {
            if (gi > 0) {
                html += '<div class="nav-type-divider"></div>';
            }
            var displayName = group.label || questionTypeLabel(group.type);
            html += '<div class="nav-type-group">';
            html += '<div class="nav-type-label">' + escapeHtml(displayName)
                + ' <span class="type-count">(' + group.indices.length + '题 · ' + group.score + '分)</span></div>';
            html += '<div class="nav-type-grid">';
            group.indices.forEach(function(i) {
                var q = currentQuestions[i];
                var idx = q.index != null ? q.index : i;
                var cls = 'q-nav-btn';
                if (i === currentQuestionIndex) cls += ' active';
                else if (currentAnswers[idx]) cls += ' answered';
                html += '<button class="' + cls + '" onclick="jumpToQuestion(' + i + ')">' + (i + 1) + '</button>';
            });
            html += '</div>';
            html += '</div>';
        });
        grid.innerHTML = html;
    }

    function jumpToQuestion(index) {
        saveCurrentAnswer();
        currentQuestionIndex = index;
        renderQuestion(index);
        renderQuestionNav();
    }

    function renderAnswerInput(type, qIndex, answerValue, options, questionContent, blankCount, qNumber) {
        switch (type) {

                return renderChoiceOptions(qIndex, answerValue, options, false);
            case 'MULTI_CHOICE':

                return renderTrueFalse(qIndex, answerValue);
            case 'FILL_BLANK':
                return renderFillBlank(qIndex, answerValue, questionContent, blankCount, qNumber);

            default:
                return '<textarea class="answer-textarea small" placeholder="请输入答案" onchange="setAnswer(' + qIndex + ', \'SHORT_ANSWER\', this.value)" oninput="setAnswer(' + qIndex + ', \'SHORT_ANSWER\', this.value)">' + escapeHtml(answerValue) + '</textarea>';
        }

    /* ===== 多空检测与渲染 ===== */

    /**
     * 空位统一识别正则（与后端 ExamBlankCounter.blankSplitRegex 保持一致）：
     * 连续 2+ 半角下划线、连续 2+ 全角下划线、中文空括号（ ）/（）、英文空括号 ( )/()。
     */
    var BLANK_REGEX_SRC = '_{2,}|＿{2,}|\\(\\s*\\)|（\\s*）';

    /**
     * 检测题目内容中的空数（两种空全部相加：下划线空 + 括号空 一并计入）。
     * 与后端 ExamBlankCounter.count 同口径，避免题干显示的空白处数量与输入框数量对不上。
     */
    function countBlanks(content) {
        if (!content) return 1;
        var matches = content.match(new RegExp(BLANK_REGEX_SRC, 'g'));
        return matches ? matches.length : 0;
    }

    /**
     * 扫描题干，按出现顺序定位每个「空」，并推断其所属小题号与类型。
     * - sub：行首 / 标点后的「（1）（2）…」子问标记（紧跟数字的「30（ ）」不算）；
     * - kind：下划线空 → 'line'（多为“列式”书写位，较宽），括号空 → 'result'（填结果，较窄）。
     * 若解析出的空位数量与后端权威 blankCount 不一致，回退为通用序号空位，确保输入框数恒等于 blankCount。
     *
     * @param content       题干文本
     * @param expectedCount 后端权威空数
     * @return [{sub, kind, seq}]，seq 为从 1 开始的空位序号
     */
    function buildBlankSlots(content, expectedCount) {
        var text = content || '';
        var re = /（\s*(\d+)\s*）|(_{2,}|＿{2,}|\(\s*\)|（\s*）)/g;
        var slots = [];
        var curSub = null;
        var m;
        while ((m = re.exec(text)) !== null) {
            if (m[1] != null) {
                // 子问标记：仅当其后紧跟非数字（即不是「30（1）」这类数字+量词）才视为分组编号
                var after = text.charAt(re.lastIndex);
                if (!/[0-9０-９]/.test(after)) {
                    curSub = m[1];
                }
                continue;
            }
            var token = m[2];
            var isUnderscore = /^_+$/.test(token) || /^＿+$/.test(token);
            slots.push({ sub: curSub, kind: isUnderscore ? 'line' : 'result', seq: slots.length + 1 });
        }
        // 空位数须与 blankCount 一致，否则口径分叉（题干含「（1）」等被漏判时）回退为纯序号空位
        if (expectedCount != null && expectedCount > 0 && slots.length !== expectedCount) {
            slots = [];
            for (var i = 0; i < expectedCount; i++) {
                slots.push({ sub: null, kind: i % 2 === 0 ? 'line' : 'result', seq: i + 1 });
            }
        }
        return slots;
    }

    /**
     * 渲染填空 / 解决问题类作答区：只呈现带标签的横线空位（按小题号分组），不复述题干。
     * 输入框数恒等于 blankCount；答案仍按题面空位顺序以 '|||' 连接保存，兼容既有评分/存储格式。
     *
     * @param qIndex      题目序号
     * @param answerValue 已存答案（||| 分隔或数组）
     * @param content     题干文本（仅用于推断空位标签，不展示）
     * @param blankCount  后端权威空数
     * @param qType       真实题型（回填答案时携带）
     * @param qNumber     试卷印刷题号（无小题号时用于标注）
     */
    function renderBlankAnswer(qIndex, answerValue, content, blankCount, qType, qNumber) {
        var slots = buildBlankSlots(content, blankCount);
        var count = (blankCount != null && blankCount > 0) ? blankCount : slots.length;
        if (count <= 0) { count = Math.max(slots.length, 1); }
        var answers = parseMultiAnswer(answerValue, count);
        var typeArg = (qType || 'FILL_BLANK');
        var mainLabel = (qNumber != null && qNumber !== '') ? ('第' + qNumber + '题') : '';

        // 按小题号归组（保持题面出现顺序）：每个不同的小题号 = 一行，行内并排该小题的若干空位横线
        var groupMap = new Map();
        slots.forEach(function(s, i) {
            var key = (s.sub != null) ? ('sub:' + s.sub) : 'main';
            if (!groupMap.has(key)) groupMap.set(key, { sub: s.sub, slots: [] });
            groupMap.get(key).slots.push(i);
        });

        var html = '<div class="blank-content">';
        groupMap.forEach(function(g) {
            var groupTag;
            if (g.sub != null) {
                groupTag = '（' + g.sub + '）';
            } else if (mainLabel) {
                groupTag = mainLabel;
            } else {
                groupTag = '作答';
            }
            html += '<div class="blank-group">';
            html += '<span class="blank-group-tag">' + escapeHtml(groupTag) + '</span>';
            html += '<div class="blank-group-fields">';
            g.slots.forEach(function(i) {
                var val = answers[i] || '';
                var filledClass = val ? ' filled' : '';
                html += '<input type="text" class="blank-inline-input blank-input' + filledClass + '" '
                    + 'data-slot="' + i + '" '
                    + 'placeholder="请作答" '
                    + 'value="' + escapeAttr(val) + '" '
                    + 'oninput="setBlankAnswer(' + qIndex + ', ' + i + ', ' + count + ', this.value, \'' + typeArg + '\')" '
                    + 'onfocus="this.classList.add(\'filled\')" '
                    + 'onblur="if(!this.value)this.classList.remove(\'filled\')">';
            });
            html += '</div>';
            html += '</div>';
        });
        html += '</div>';
        return html;
    }

    /**
     * 解析多空答案为数组
     */
    function parseMultiAnswer(answerValue, count) {
        var answers = [];
        if (answerValue) {
            if (Array.isArray(answerValue)) {
                answers = answerValue.slice();
            } else if (typeof answerValue === 'string') {
                // 尝试 JSON 解析
                try {
                    var parsed = JSON.parse(answerValue);
                    if (Array.isArray(parsed)) {
                        answers = parsed;
                    } else {
                        answers = answerValue.split('|||').map(function(s) { return s.trim(); });
                    }
                } catch(e) {
                    answers = answerValue.split('|||').map(function(s) { return s.trim(); });
                }
            }
        }
        while (answers.length < count) answers.push('');
        return answers;
    }

    /**
     * 设置单个空的答案：按 data-slot 归位收集（与题面空位顺序一致），仍用 '|||' 连接保存。
     */
    function setBlankAnswer(qIndex, blankIdx, totalBlanks, value, qType) {
        var blankContent = document.querySelector('.blank-content');
        var slots = [];
        if (blankContent) {
            blankContent.querySelectorAll('.blank-inline-input').forEach(function(inp) {
                var idx = parseInt(inp.getAttribute('data-slot'), 10);
                if (isNaN(idx)) idx = slots.length;
                slots.push({ idx: idx, val: inp.value || '' });
            });
        }
        slots.sort(function(a, b) { return a.idx - b.idx; });
        var allValues = slots.map(function(s) { return s.val; });
        var joined = allValues.join('|||');
        if (allValues.some(function(v) { return v !== ''; })) {
            currentAnswers[qIndex] = {
                questionIndex: qIndex,
                questionType: qType || 'FILL_BLANK',
                answer: joined
            };
        } else {
            delete currentAnswers[qIndex];
        }
        renderQuestionNav();
    }

    /**
     * 渲染填空题（支持多空）
     */
    function renderFillBlank(qIndex, answerValue, content, blankCount, qNumber) {
        var count = (blankCount != null && blankCount > 0) ? blankCount : countBlanks(content);
        if (count >= 2) {
            // 多空：作答区只呈现带小题号标签的横线空位，不复述题干
            return renderBlankAnswer(qIndex, answerValue, content, count, 'FILL_BLANK', qNumber);
        }
        // 单空：普通输入框
        return '<input type="text" class="answer-input" placeholder="请输入答案" value="' + escapeAttr(answerValue) + '" onchange="setAnswer(' + qIndex + ', \'FILL_BLANK\', this.value)" oninput="setAnswer(' + qIndex + ', \'FILL_BLANK\', this.value)">';
    }

    /**
     * 渲染简答题（多问时按小题号分组给出横线空位；书写量大的单问仍用多行文本域）
     */
    function renderShortAnswer(qIndex, answerValue, content, blankCount, qNumber) {
        var count = (blankCount != null && blankCount > 0) ? blankCount : countBlanks(content);
        if (count >= 2) {
            // 多空：作答区只呈现带标签的横线空位，携带真实题型 SHORT_ANSWER
            return renderBlankAnswer(qIndex, answerValue, content, count, 'SHORT_ANSWER', qNumber);
        }
        // 单问 / 无空：多行文本域，便于书写解答过程
        return '<textarea class="answer-textarea small" placeholder="请输入答案" onchange="setAnswer(' + qIndex + ', \'SHORT_ANSWER\', this.value)" oninput="setAnswer(' + qIndex + ', \'SHORT_ANSWER\', this.value)">' + escapeHtml(answerValue) + '</textarea>';
    }

    function renderChoiceOptions(qIndex, answerValue, options, multi) {
        // 防御性解析：options 可能是 JSON 字符串而非数组
        if (!options) return '<p style="color:var(--gray-500)">无选项</p>';
        if (typeof options === 'string') {
            try { options = JSON.parse(options); } catch(e) { options = []; }
        }
        if (!Array.isArray(options) || options.length === 0) return '<p style="color:var(--gray-500)">无选项</p>';

        var inputType = multi ? 'checkbox' : 'radio';
        var selectedValues = [];
        if (answerValue) {
            if (Array.isArray(answerValue)) {
                selectedValues = answerValue;
            } else if (typeof answerValue === 'string') {
                selectedValues = answerValue.split(',').map(function(s) { return s.trim(); }).filter(Boolean);
            }
        }
        var html = '<div class="option-list">';
        options.forEach(function(opt) {
            var key = opt.key || '';
            var val = opt.value || '';
            var checked = selectedValues.indexOf(key) !== -1 ? ' checked' : '';
            var selectedClass = checked ? ' selected' : '';
            html += '<div class="option-item' + selectedClass + '" onclick="toggleOption(this, ' + qIndex + ', \'' + (multi ? 'MULTI_CHOICE' : 'SINGLE_CHOICE') + '\', \'' + escapeAttr(key) + '\', ' + multi + ')">';
            html += '<input type="' + inputType + '" name="q_' + qIndex + '"' + checked + ' tabindex="-1">';
            html += '<label><strong>' + escapeHtml(key) + '.</strong> ' + escapeHtml(val) + '</label>';
            html += '</div>';
        });
        html += '</div>';
        return html;
    }

    function renderTrueFalse(qIndex, answerValue) {
        var isTrue = answerValue === '正确';
        var isFalse = answerValue === '错误';
        var html = '<div class="option-list">';
        html += '<div class="option-item' + (isTrue ? ' selected' : '') + '" onclick="toggleOption(this, ' + qIndex + ', \'TRUE_FALSE\', \'正确\', false)">';
        html += '<input type="radio" name="q_' + qIndex + '"' + (isTrue ? ' checked' : '') + ' tabindex="-1">';
        html += '<label>正确</label></div>';
        html += '<div class="option-item' + (isFalse ? ' selected' : '') + '" onclick="toggleOption(this, ' + qIndex + ', \'TRUE_FALSE\', \'错误\', false)">';
        html += '<input type="radio" name="q_' + qIndex + '"' + (isFalse ? ' checked' : '') + ' tabindex="-1">';
        html += '<label>错误</label></div>';
        html += '</div>';
        return html;
    }

    /* ===== Answer Management ===== */
    function setAnswer(qIndex, type, value) {
        if (value !== '' && value != null) {
            currentAnswers[qIndex] = {
                questionIndex: qIndex,
                questionType: type,
                answer: value
            };
        } else {
            delete currentAnswers[qIndex];
        }
        renderQuestionNav();
    }

    function toggleOption(el, qIndex, type, key, multi) {
        if (multi) {
            var input = el.querySelector('input');
            input.checked = !input.checked;
            el.classList.toggle('selected', input.checked);

            var checked = [];
            var parent = el.parentElement;
            parent.querySelectorAll('.option-item').forEach(function(item) {
                var inp = item.querySelector('input');
                if (inp.checked) {
                    var lbl = item.querySelector('label').textContent.trim();
                    var k = lbl.split('.')[0].trim();
                    checked.push(k);
                }
            });
            if (checked.length > 0) {
                currentAnswers[qIndex] = {
                    questionIndex: qIndex,
                    questionType: type,
                    answer: checked.join(',')
                };
            } else {
                delete currentAnswers[qIndex];
            }
        } else {
            var parent = el.parentElement;
            parent.querySelectorAll('.option-item').forEach(function(item) {
                item.classList.remove('selected');
                item.querySelector('input').checked = false;
            });
            el.classList.add('selected');
            el.querySelector('input').checked = true;
            currentAnswers[qIndex] = {
                questionIndex: qIndex,
                questionType: type,
                answer: key
            };
        }
        renderQuestionNav();
    }

    function saveCurrentAnswer() {
        var area = document.getElementById('questionArea');
        var textarea = area.querySelector('.answer-textarea');
        var input = area.querySelector('.answer-input');
        if (textarea) {
            var q = currentQuestions[currentQuestionIndex];
            var qIndex = q.index != null ? q.index : currentQuestionIndex;
            var type = q.type || 'SHORT_ANSWER';
            setAnswer(qIndex, type, textarea.value);
        }
        if (input) {
            var q = currentQuestions[currentQuestionIndex];
            var qIndex = q.index != null ? q.index : currentQuestionIndex;
            setAnswer(qIndex, 'FILL_BLANK', input.value);
        }
    }

    /* ===== Build full answers list (all questions, unanswered → empty) ===== */
    function buildFullAnswersList() {
        var list = [];
        currentQuestions.forEach(function (q, pos) {
            var idx = q.index != null ? q.index : pos;
            var num = q.number != null ? q.number : idx;
            var a = currentAnswers[idx];
            list.push({
                questionIndex: idx,
                questionNumber: num,
                questionType: q.type,
                content: q.content || '',
                answer: a ? a.answer : ''
            });
        });
        return list;
    }

    /* ===== Save Answers ===== */
    function saveAnswers(silent) {
        if (!currentSession) return Promise.resolve();
        saveCurrentAnswer();

        var answersList = buildFullAnswersList();
        var sessionKey = currentSession.sessionKey;
        var p = apiRequest('/api/exam/' + sessionKey + '/save', {
            method: 'POST',
            body: JSON.stringify({ token: token, answers: answersList })
        });
        if (silent) {
            // 静默模式（自动保存 / beforeunload）：把失败暴露给调用方，由其决定重试 / 提示。
            return p;
        }
        return p.then(function () {
            showToast('答案已保存', 'success');
        }).catch(function (err) {
            showToast('保存失败: ' + err.message, 'error');
        });
    }

    /* ===== Submit Exam ===== */
    function showSubmitConfirm() {
        saveCurrentAnswer();
        var answered = Object.keys(currentAnswers).length;
        var total = currentQuestions.length;
        var unanswered = total - answered;
        var text = '确定要提交试卷吗？提交后将无法修改答案。';
        if (unanswered > 0) {
            text += '\n\n您还有 ' + unanswered + ' 道题未作答。';
        }
        text += '\n\n已作答 ' + answered + ' / ' + total + ' 题。';
        document.getElementById('submitModalText').textContent = text;
        document.getElementById('submitModal').classList.add('show');
    }

    function closeSubmitModal() {
        document.getElementById('submitModal').classList.remove('show');
    }

    function submitExam() {
        // 并发/重复提交守卫：手动点击 + 倒计时到点自动提交 + 弹窗按钮可能同时触发；
        // 一旦在途，后续调用直接返回，避免重复 save+submit 与"提交失败"噪声。
        if (isSubmitting) {
            console.debug('[exam] submitExam: 已有提交在途，忽略重复调用');
            return;
        }
        closeSubmitModal();
        clearAutoSubmitTimer();
        if (!currentSession) return;
        var sessionKey = currentSession.sessionKey;

        isSubmitting = true;
        var confirmBtn = document.getElementById('submitModalConfirm');
        if (confirmBtn) confirmBtn.disabled = true;

        // Save answers first（全量落行，含未答）
        saveCurrentAnswer();
        var answersList = buildFullAnswersList();

        // Save then submit —— 保存失败必须中止提交，绝不吞掉（否则答案静默丢失）
        var savePromise = answersList.length > 0
            ? apiRequest('/api/exam/' + sessionKey + '/save', {
                method: 'POST',
                body: JSON.stringify({ token: token, answers: answersList })
              })
            : Promise.resolve();

        savePromise.then(function () {
            return apiRequest('/api/exam/' + sessionKey + '/submit', {
                method: 'POST',
                body: JSON.stringify({ token: token })
            });
        }).then(function () {
            stopTimer();
            stopAutoSave();
            isSubmitting = false;
            if (confirmBtn) confirmBtn.disabled = false;
            showToast('试卷已提交', 'success');
            document.getElementById('examTakingPage').classList.remove('exam-locked');
            backToList();
        }).catch(function (err) {
            isSubmitting = false;
            if (confirmBtn) confirmBtn.disabled = false;
            showToast('提交失败（答案未保存成功，请重试）: ' + err.message, 'error');
        });
    }

    /* ===== View Results ===== */
    function viewResults(sessionKey) {
        document.getElementById('appContainer').style.display = 'none';
        document.getElementById('examTakingPage').style.display = 'none';
        document.getElementById('resultsPage').style.display = 'block';

        var container = document.getElementById('resultsContainer');
        container.innerHTML = '<div class="empty-state"><div class="loading-spinner"></div><p>加载成绩中...</p></div>';

        Promise.all([
            apiRequest('/api/exam/' + sessionKey),
            apiRequest('/api/exam/' + sessionKey + '/answers')
        ]).then(function(results) {
            var session = results[0];
            var answers = Array.isArray(results[1]) ? results[1] : [];
            renderResults(session, answers);
        }).catch(function(err) {
            container.innerHTML = '<div class="empty-state"><p>加载失败: ' + err.message + '</p></div>';
        });
    }

    function renderResults(session, answers) {
        var container = document.getElementById('resultsContainer');

        var questions = [];
        if (session.questionsJson) {
            if (typeof session.questionsJson === 'string') {
                try { questions = JSON.parse(session.questionsJson); } catch(e) { questions = []; }
            } else {
                questions = session.questionsJson;
            }
        }

        var totalScore = session.totalScore != null ? session.totalScore : '--';
        var aiScore = session.aiScore != null ? session.aiScore : '--';
        var finalScore = session.finalScore != null ? session.finalScore : totalScore;

        var html = '';

        // Header
        html += '<div class="results-header">';
        html += '<h2>' + escapeHtml(session.topic || '考试结果') + '</h2>';
        html += '<div class="score-cards">';

        var totalClass = '';
        if (typeof totalScore === 'number') {
            var maxScore = session.totalMaxScore || 100;
            totalClass = totalScore / maxScore >= 0.6 ? 'high' : 'low';
        }

        html += '<div class="score-card"><div class="score-value ' + totalClass + '">' + totalScore + '</div><div class="score-label">总分</div></div>';
        if (session.aiScore != null) {
            html += '<div class="score-card"><div class="score-value">' + aiScore + '</div><div class="score-label">AI评分</div></div>';
        }
        if (session.finalScore != null) {
            var finalClass = '';
            if (typeof finalScore === 'number') {
                var maxScore2 = session.totalMaxScore || 100;
                finalClass = finalScore / maxScore2 >= 0.6 ? 'high' : 'low';
            }
            html += '<div class="score-card"><div class="score-value ' + finalClass + '">' + finalScore + '</div><div class="score-label">最终得分</div></div>';
        }
        html += '</div>';
        html += '<div style="margin-top:16px;font-size:13px;color:var(--gray-500)">';
        html += '状态: ' + statusBadge(session.status || 'PUBLISHED');
        html += ' | 提交时间: ' + formatDateTime(session.submitTime);
        html += '</div>';
        html += '</div>';

        // Breakdown
        html += '<div class="results-breakdown">';
        html += '<h3>答题详情</h3>';

        if (questions.length === 0 && answers.length === 0) {
            html += '<div class="empty-state" style="padding:24px"><p>暂无答题详情</p></div>';
        }

        answers.forEach(function(ans, i) {
            var q = questions.find(function(qq) { return (qq.index != null ? qq.index : questions.indexOf(qq)) === ans.questionIndex; }) || questions[i];
            var score = ans.effectiveScore != null ? ans.effectiveScore : null;
            var maxScore = q ? (q.maxScore || 0) : 0;
            var correctAnswer = ans.correctAnswer || '';
            var aiFeedback = ans.aiFeedback || '';
            var reviewFeedback = ans.reviewFeedback || '';

            var resultClass = '';
            var scoreBadgeClass = '';
            if (score != null) {
                if (score >= maxScore && maxScore > 0) {
                    resultClass = 'correct';
                    scoreBadgeClass = 'full';
                } else if (score <= 0) {
                    resultClass = 'wrong';
                    scoreBadgeClass = 'zero';
                } else {
                    resultClass = 'partial';
                    scoreBadgeClass = 'partial';
                }
            }

            html += '<div class="result-question ' + resultClass + '">';
            html += '<div class="result-q-header">';
            html += '<div class="question-number">' + (i + 1) + '</div>';
            html += '<div class="question-title-area">';
            html += '<div class="question-type-badge">' + questionTypeLabel(ans.questionType || (q ? q.type : '')) + '</div>';
            html += '</div>';
            if (score != null) {
                html += '<span class="result-score-badge ' + scoreBadgeClass + '">' + score + ' / ' + maxScore + '</span>';
            }
            html += '</div>';

            if (q) {
                html += '<div class="result-q-content">' + escapeHtml(q.content || '') + '</div>';
                html += renderQuestionImages(q.images);
            }

            html += '<div class="result-detail-grid">';
            html += '<span class="label">我的答案:</span>';
            html += '<span class="value">' + escapeHtml(ans.studentAnswer || '未作答') + '</span>';

            if (correctAnswer) {
                html += '<span class="label">正确答案:</span>';
                html += '<span class="value correct-text">' + escapeHtml(correctAnswer) + '</span>';
            }

            if (aiFeedback) {
                html += '<span class="label">AI点评:</span>';
                html += '<span class="value">' + escapeHtml(aiFeedback) + '</span>';
            }

            if (reviewFeedback) {
                html += '<span class="label">教师评语:</span>';
                html += '<span class="value">' + escapeHtml(reviewFeedback) + '</span>';
            }

            html += '</div>';
            html += '</div>';
        });

        html += '</div>';

        // Back button
        html += '<div style="text-align:center;margin-top:24px;padding-bottom:24px">';
        html += '<button class="btn btn-secondary" onclick="backToList()">返回考试列表</button>';
        html += '</div>';

        container.innerHTML = html;
    }

    /* ===== Helpers ===== */
    function escapeHtml(str) {
        if (!str) return '';
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(String(str)));
        return div.innerHTML;
    }

    function escapeAttr(str) {
        if (!str) return '';
        return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
</script>
