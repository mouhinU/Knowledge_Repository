<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>设置管理员密码 · Knowledge Repository</title>
    <link href="/admin/assets/css/common.css" rel="stylesheet">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f1f5f9; margin: 0; }
        .sp-card { width: 420px; max-width: calc(100vw - 40px); background: #fff; border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 12px 40px rgba(15, 23, 42, .12); padding: 32px 30px; }
        .sp-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
        .sp-brand .logo-dot { width: 34px; height: 34px; border-radius: 9px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; }
        .sp-brand h1 { font-size: 18px; margin: 0; color: var(--text); }
        .sp-sub { font-size: 13px; color: var(--text-light); margin: 0 0 22px; line-height: 1.55; }
        .sp-msg { display: none; border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px; line-height: 1.5; }
        .sp-msg.err { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
        .sp-msg.ok { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
        .sp-card .form-group { margin-bottom: 16px; }
        .sp-hint { font-size: 12px; color: var(--text-light); margin-top: 4px; }
        #sp-btn { width: 100%; margin-top: 4px; }
        .sp-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--text-light); word-break: break-all; background: #f8fafc; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); }
        .sp-footer { margin-top: 18px; font-size: 12px; color: var(--text-light); text-align: center; }
        .sp-footer a { color: var(--primary); text-decoration: none; }
    </style>
</head>
<body>
<div class="sp-card">
    <div class="sp-brand">
        <span class="logo-dot">K</span>
        <h1>设置管理员密码</h1>
    </div>
    <p class="sp-sub">
        您正在为新建租户激活首位管理员账号。请填写下方一次性邀请码及新密码，完成后即可用新密码登录管理台。
        邀请码只能使用一次，如已过期或失效请联系平台管理员重新签发。
    </p>
    <div class="sp-msg err" id="sp-err"></div>
    <div class="sp-msg ok" id="sp-ok"></div>
    <form id="sp-form" autocomplete="off">
        <div class="form-group">
            <label class="form-label" for="invite-code">邀请码</label>
            <input class="form-input" id="invite-code" name="inviteCode" type="text" required readonly>
            <div class="sp-hint">邀请码从 URL 参数自动带入，不可修改。</div>
        </div>
        <div class="form-group">
            <label class="form-label" for="new-password">新密码</label>
            <input class="form-input" id="new-password" name="newPassword" type="password"
                   autocomplete="new-password" minlength="8" maxlength="72" required>
            <div class="sp-hint">长度 8-72 字符，建议混合大小写字母、数字与符号。</div>
        </div>
        <div class="form-group">
            <label class="form-label" for="confirm-password">确认新密码</label>
            <input class="form-input" id="confirm-password" name="confirmPassword" type="password"
                   autocomplete="new-password" minlength="8" maxlength="72" required>
        </div>
        <button class="btn btn-primary" id="sp-btn" type="submit">设置密码并激活账号</button>
    </form>
    <div class="sp-footer" id="sp-footer" style="display:none;">
        <a href="/admin/login.html" id="sp-login-link">前往登录 →</a>
    </div>
</div>

<script>
    (function () {
        'use strict';

        // 极简版：本页独立于 admin 域，不加载 common.js，避免 token 相关逻辑误触发。
        var API = '';

        function qs(name) {
            var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
            return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
        }

        var errBox = document.getElementById('sp-err');
        var okBox = document.getElementById('sp-ok');
        var btn = document.getElementById('sp-btn');
        var form = document.getElementById('sp-form');
        var codeInput = document.getElementById('invite-code');
        var pwdInput = document.getElementById('new-password');
        var confirmInput = document.getElementById('confirm-password');
        var footer = document.getElementById('sp-footer');

        var rawCode = qs('code');
        if (!rawCode) {
            errBox.textContent = '缺少邀请码参数（?code=…），请从平台管理员发送的完整链接打开本页。';
            errBox.style.display = 'block';
            codeInput.value = '';
            btn.disabled = true;
            return;
        }
        codeInput.value = rawCode;

        function showErr(msg) {
            okBox.style.display = 'none';
            errBox.textContent = msg;
            errBox.style.display = 'block';
        }

        function showOk(msg) {
            errBox.style.display = 'none';
            okBox.textContent = msg;
            okBox.style.display = 'block';
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            errBox.style.display = 'none';
            okBox.style.display = 'none';

            var pwd = pwdInput.value;
            var confirm = confirmInput.value;
            if (pwd.length < 8 || pwd.length > 72) {
                showErr('密码长度需为 8-72 字符');
                return;
            }
            if (pwd !== confirm) {
                showErr('两次输入的密码不一致');
                return;
            }

            btn.disabled = true;
            btn.textContent = '提交中…';
            try {
                var res = await fetch(API + '/api/admin/auth/set-password-by-invite', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ inviteCode: rawCode, newPassword: pwd })
                });
                var data = await res.json().catch(function () { return {}; });
                if (res.ok && data && data.success) {
                    showOk((data.message || '密码已设置') + '，用户名：' + (data.username || '') + '，租户：' + (data.tenantKey || ''));
                    form.style.display = 'none';
                    footer.style.display = 'block';
                    return;
                }
                showErr((data && data.error) || '设置密码失败，请检查邀请码是否有效');
            } catch (err) {
                showErr('网络异常，请稍后重试');
            } finally {
                btn.disabled = false;
                btn.textContent = '设置密码并激活账号';
            }
        });
    })();
</script>
</body>
</html>
